<title>MyOps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an office floor — roster of staff badges on the left, the Manager's desk (chat) in the middle,
   the out-tray (drafts awaiting sign-off), the task board and the contact book on the right. Phones get a tab bar. */
:root {
  --bg: #eef0ec;
  --surface: #fbfbf8;
  --ink: #18212b;
  --muted: #5d6874;
  --line: #d9ddd6;
  --accent: #d2551f;        /* signal orange: the "needs your sign-off" colour */
  --accent-ink: #ffffff;
  --accent-soft: #fbe6da;
  --staff: #233a57;         /* navy for core staff badges */
  --staff-soft: #e2e8f0;
  --good: #1f7a46;
  --good-soft: #def0e4;
  --bad: #b3261e;
  --bad-soft: #f8e1df;
  --me: #233a57;
  --me-ink: #ffffff;
  --bubble: #f0f2ee;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161a; --surface: #1a1f25; --ink: #e7eaee; --muted: #9aa4ae; --line: #2b323a;
    --accent: #f07a45; --accent-ink: #160b05; --accent-soft: #3a2218;
    --staff: #9fb6d6; --staff-soft: #1f2a38; --good: #74cf96; --good-soft: #17301f;
    --bad: #f28b82; --bad-soft: #3a1e1c; --me: #31527d; --me-ink: #ffffff; --bubble: #232930;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161a; --surface: #1a1f25; --ink: #e7eaee; --muted: #9aa4ae; --line: #2b323a;
  --accent: #f07a45; --accent-ink: #160b05; --accent-soft: #3a2218;
  --staff: #9fb6d6; --staff-soft: #1f2a38; --good: #74cf96; --good-soft: #17301f;
  --bad: #f28b82; --bad-soft: #3a1e1c; --me: #31527d; --me-ink: #ffffff; --bubble: #232930;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column;
}
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.2; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 14px 10px;
}
header.top h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
header.top h1 span { color: var(--accent); }
.tagline { color: var(--muted); font-size: 13px; flex: 1; min-width: 200px; }
.space-sel { width: auto; max-width: 220px; padding: 5px 8px; font-size: 14px; font-weight: 600; border-radius: 8px; }
.status { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.status.bad { color: var(--bad); }

.tabs { display: none; gap: 4px; padding-bottom: 10px; }
.tabs button {
  flex: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 7px 4px; font-size: 13px; font-weight: 600; color: var(--muted);
}
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--ink); }

main {
  flex: 1; min-height: 0; display: grid; gap: 14px;
  grid-template-columns: 270px minmax(0, 1fr) 340px;
  padding-bottom: 16px;
}
.pane {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  display: flex; flex-direction: column; min-height: 0; min-width: 0;
}
.pane > .head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  padding: 12px 14px 8px; border-bottom: 1px solid var(--line);
}
.pane > .head h2 { font-size: 16px; font-weight: 700; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.scroll { overflow-y: auto; min-height: 0; flex: 1; padding: 12px 14px; }

/* Staff badges */
.badges { display: flex; flex-direction: column; gap: 10px; }
.badge {
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface);
  display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 2px 10px; align-items: start;
}
.badge .mark {
  grid-row: span 3; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center;
  font-family: var(--display); font-weight: 700; font-size: 15px;
  background: var(--accent-soft); color: var(--accent);
}
.badge.staff .mark { background: var(--staff-soft); color: var(--staff); }
.badge .name { font-weight: 600; display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
.badge .name code { font-family: var(--mono); font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
.badge .role { color: var(--muted); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.chip { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 5px; background: var(--bubble); color: var(--muted); }
.section-label { margin: 16px 0 8px; }
.fire { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 0 2px; }
.fire:hover, .fire.armed { color: var(--bad); }
.hire-form { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
.conn-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
.hire-form textarea { min-height: 64px; }

/* Chat */
.log { display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 86%; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.msg .who { font-size: 12px; color: var(--muted); font-weight: 600; }
.msg .text { padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.user .text { background: var(--me); color: var(--me-ink); border-bottom-right-radius: 4px; }
.msg.manager .text { background: var(--bubble); border-bottom-left-radius: 4px; }
.msg.working .text { color: var(--muted); font-style: italic; }
.steps { list-style: none; margin: 2px 0 0; padding: 0 0 0 4px; display: flex; flex-direction: column; gap: 2px; }
.steps li { font-size: 12.5px; color: var(--muted); padding-left: 14px; position: relative; }
.steps li::before { content: ""; position: absolute; left: 2px; top: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.steps li.done::before { background: var(--good); }
.steps li.fail::before { background: var(--bad); }
.steps li.live::before { background: var(--accent); animation: pulse 1s infinite alternate; }
@keyframes pulse { to { opacity: 0.3; } }
@media (prefers-reduced-motion: reduce) { .steps li.live::before { animation: none; } }
details.steps-wrap summary { font-size: 12px; color: var(--muted); cursor: pointer; }

.empty { margin: auto; max-width: 460px; text-align: center; color: var(--muted); padding: 24px 8px; }
.empty h3 { color: var(--ink); font-size: 20px; margin-bottom: 6px; }
.suggest { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
.suggest button {
  text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  padding: 9px 12px; font-size: 14px;
}
.suggest button:hover { border-color: var(--ink); }
.setup { margin: auto; width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 10px; padding: 16px 4px; }
.setup h3 { font-size: 22px; }
.setup p { color: var(--muted); font-size: 14px; margin: 0; }
.setup label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; }
.setup label.check { flex-direction: row; align-items: center; gap: 8px; font-weight: 500; }
.setup label.check input { width: auto; }
.setup textarea { min-height: 70px; resize: vertical; }
.setup input, .setup textarea { font-weight: 400; }
.setup .row { display: flex; gap: 8px; flex-wrap: wrap; }
.op { font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
.op .row { display: flex; gap: 6px; flex-wrap: wrap; }

.compose { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); align-items: flex-end; }
textarea, input, select {
  width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px;
}
.compose textarea { resize: none; min-height: 44px; max-height: 160px; }
.btn {
  border: 1px solid var(--ink); background: var(--ink); color: var(--surface); border-radius: 10px;
  padding: 9px 16px; font-weight: 600; white-space: nowrap;
}
.btn.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.small { padding: 4px 10px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: 0.5; cursor: default; }
.notice { font-size: 13px; color: var(--muted); padding: 8px 12px; border-top: 1px solid var(--line); }
.notice.bad { color: var(--bad); }

/* Right column */
.subtabs { display: flex; gap: 2px; }
.subtabs button { border: 0; background: none; padding: 2px 6px; border-radius: 6px; font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--muted); white-space: nowrap; }
.subtabs button[aria-selected="true"] { color: var(--ink); background: var(--bubble); }
.count { font-family: var(--mono); font-size: 11px; background: var(--accent); color: var(--accent-ink); border-radius: 99px; padding: 0 6px; margin-left: 4px; vertical-align: 2px; }
.count[hidden] { display: none; }
.draft { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
.draft.pending { border-left: 3px solid var(--accent); }
.draft .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.draft .to { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
.draft .subject { font-weight: 600; }
.draft .body { white-space: pre-wrap; font-size: 14px; overflow-wrap: anywhere; }
.draft .row { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font-family: var(--mono); font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--bubble); color: var(--muted); }
.pill.pending { background: var(--accent-soft); color: var(--accent); }
.pill.approved, .pill.sent { background: var(--good-soft); color: var(--good); }
.pill.rejected { background: var(--bad-soft); color: var(--bad); }
.filter { display: flex; gap: 6px; margin-bottom: 10px; }
.lead { border-bottom: 1px solid var(--line); padding: 8px 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; }
.lead .n { font-weight: 600; overflow-wrap: anywhere; }
.lead .c { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.lead .contact { grid-column: 1 / -1; font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.lead select { width: auto; padding: 2px 6px; font-size: 12px; border-radius: 6px; }
.lead .notes { grid-column: 1 / -1; font-size: 13px; }
.lead .id { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.muted { color: var(--muted); }
.task { border-bottom: 1px solid var(--line); padding: 8px 0; display: flex; flex-direction: column; gap: 4px; }
.task .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.task .brief { font-size: 14px; overflow-wrap: anywhere; }
.task details { font-size: 13px; color: var(--muted); }
.task details div { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 4px; }
.pill.working { background: var(--accent-soft); color: var(--accent); }
.pill.done { background: var(--good-soft); color: var(--good); }
.pill.failed { background: var(--bad-soft); color: var(--bad); }

@media (max-width: 1100px) { main { grid-template-columns: 240px minmax(0, 1fr) 300px; } }
@media (max-width: 860px) {
  .tabs { display: flex; }
  main { grid-template-columns: minmax(0, 1fr); }
  main > .pane { display: none; }
  main > .pane.show { display: flex; }
  .msg { max-width: 94%; }
}
@media (max-width: 600px) { .tagline { display: none; } header.top { justify-content: space-between; } }
</style>

<header class="top">
  <h1>My<span>Ops</span></h1>
  <select id="spaceSel" class="space-sel" aria-label="Profile"></select>
  <div class="tagline" id="tagline">Your personal AI team. Tell the Manager what you need; it hires bots through the Recruiter and HR, delegates the work, and queues every message for your sign-off.</div>
  <div class="status" id="status">Starting…</div>
</header>

<nav class="tabs" role="tablist" aria-label="Sections">
  <button role="tab" data-pane="pane-chat" aria-selected="true">Manager</button>
  <button role="tab" data-pane="pane-team" aria-selected="false">Team</button>
  <button role="tab" data-pane="pane-right" aria-selected="false">Out-tray<span class="count" id="tabCount" hidden></span></button>
</nav>

<main>
  <section class="pane" id="pane-team" aria-label="Team">
    <div class="head"><h2>Team</h2><span class="eyebrow" id="headcount">4 staff</span></div>
    <div class="scroll">
      <div class="eyebrow section-label" style="margin-top:0">Core staff</div>
      <div class="badges" id="staff"></div>
      <div class="eyebrow section-label">Hired bots</div>
      <div class="badges" id="bots"></div>
      <div class="eyebrow section-label">Connections</div>
      <div id="connections"></div>
      <div class="eyebrow section-label">Profile</div>
      <div id="operation"></div>
      <form class="hire-form" id="hireForm">
        <label class="eyebrow" for="hireInput">Hire directly</label>
        <textarea id="hireInput" placeholder="Job description, e.g. Plans my week from my goals and drafts the emails it needs"></textarea>
        <button class="btn ghost small" id="hireBtn" type="submit">Send to Recruiter</button>
      </form>
    </div>
  </section>

  <section class="pane show" id="pane-chat" aria-label="Manager">
    <div class="head"><h2>Manager</h2><button class="btn ghost small" id="checkBtn" type="button">Check Claude</button></div>
    <div class="scroll" id="chatScroll"><div class="log" id="log"></div></div>
    <div class="notice" id="chatNotice" hidden></div>
    <form class="compose" id="compose">
      <textarea id="input" rows="1" placeholder="Tell the Manager what you need…" aria-label="Message to the Manager"></textarea>
      <button class="btn" id="sendBtn" type="submit">Send</button>
      <button class="btn ghost" id="stopBtn" type="button" hidden>Stop</button>
    </form>
  </section>

  <section class="pane" id="pane-right" aria-label="Out-tray, tasks and contacts">
    <div class="head">
      <div class="subtabs" role="tablist">
        <button role="tab" data-sub="outbox" aria-selected="true">Out-tray<span class="count" id="outCount" hidden></span></button>
        <button role="tab" data-sub="tasks" aria-selected="false">Tasks</button>
        <button role="tab" data-sub="reports" aria-selected="false">Reports</button>
        <button role="tab" data-sub="leads" aria-selected="false">Contacts</button>
      </div>
      <span class="eyebrow" id="rightMeta" hidden></span>
    </div>
    <div class="scroll" id="sub-outbox"></div>
    <div class="scroll" id="sub-tasks" hidden></div>
    <div class="scroll" id="sub-reports" hidden></div>
    <div class="scroll" id="sub-leads" hidden>
      <div class="filter"><input id="leadSearch" placeholder="Search contacts" aria-label="Search contacts"></div>
      <div class="filter" id="atButtons" hidden>
        <button class="btn ghost small" type="button" id="atSyncBtn">Sync to Airtable</button>
        <button class="btn ghost small" type="button" id="atImportBtn">Import from Airtable</button>
      </div>
      <div class="filter" id="atSetup" hidden>
        <button class="btn ghost small" type="button" id="atSetupBtn">Create an Airtable contact table</button>
      </div>
      <div id="leadList"></div>
    </div>
  </section>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k);
  return n;
};

// ---------- The company ------------------------------------------------------
const STAFF = [
  { name: "manager", title: "Manager", mark: "M", role: "Takes your requests, plans the work, delegates and reports back." },
  { name: "recruiter", title: "Recruiter", mark: "R", role: "Designs a new bot when no one on the team fits a job." },
  { name: "hr", title: "HR", mark: "H", role: "Reviews every candidate: right role, safe instructions, least access." },
  { name: "cto", title: "CTO", mark: "C", role: "Owns the tech: Claude models, connections and data; checks every hire's tools can actually work." },
];
const TOOLS = {
  crm_read: "read the contact book (leads, clients and other contacts)",
  crm_write: "add contacts and update their status and notes",
  draft_email: "draft emails (they wait for the owner's approval)",
  draft_sms: "draft text messages (they wait for the owner's approval)",
  find_leads: "look up real companies and contacts (with emails and phones) in the owner's Clay account",
  web_research: "research companies on the live web through Clay: recent news, open jobs, growth, funding, and custom questions answered with sources",
  airtable: "search and read the owner's Airtable contact table (every contact in the contact book is also synced there automatically)",
  research_read: "read the latest research reports: real market data (prices, technicals, SEC financials) from the MyOps research engine",
};
// Airtable: where leads sync to. Saved in this page's data (config/airtable) so it can be changed later.
const AIRTABLE = "Airtable";
// Clay tools a find_leads bot may call (names and inputs checked against the live Clay connector).
const CLAY = "Clay";
const CLAY_TOOLS = ["search-companies", "search-contacts", "load-more-search-results", "add-contact-data-points", "add-company-data-points", "get-task-context"];
const RESEARCH_TYPES = ["Recent News", "Open Jobs", "Headcount Growth", "Latest Funding", "Annual Revenue", "Company Customers", "Company Competitors", "Tech Stack", "Website Traffic"];
const STATUSES = ["new", "contacted", "qualified", "proposal", "won", "lost"];
const NAME_RE = /^[a-z][a-z0-9_]{1,31}$/;
const MAX_ROUNDS = 4;

const S = {
  bots: [], leads: [], outbox: [], chat: [], tasks: [], reports: [],
  profile: null, loaded: false, editingProfile: false, // who the open profile works for
  root: null, space: "main", spaces: [], unsubs: [], // all profiles, and the one open now
  memory: null, // the open profile's long-term chat memory (config/memory)

  sample: null, store: null, readOnly: false, busy: false, ctl: null, tier: "default", lastError: "", mcp: null, clay: "checking", at: null, atState: "checking", atNote: "",
  live: null, // the in-progress manager turn: {steps: [{text, state}]}
};

// ---------- Storage: the artifact's database, or memory in a preview ----------
function memoryStore() {
  const cols = {}, subs = {};
  const emit = (c) => (subs[c] || []).forEach((fn) => fn(Object.entries(cols[c] || {}).map(([id, d]) => ({ id, ...d }))));
  return {
    persistent: false,
    sub(c, fn) { (subs[c] ||= []).push(fn); emit(c); return () => { subs[c] = subs[c].filter((f) => f !== fn); }; },
    async set(c, id, d) { (cols[c] ||= {})[id] = { ...d }; emit(c); },
    async update(c, id, d) { cols[c][id] = { ...cols[c][id], ...d }; emit(c); },
    async del(c, id) { delete (cols[c] || {})[id]; emit(c); },
    async clear(c) { cols[c] = {}; emit(c); },
  };
}
function dbStore(db) {
  return {
    persistent: true,
    sub(c, fn, onErr) {
      let q = db.collection(c);
      if (c === "chat" || c.endsWith("/chat")) q = q.orderBy("at", "desc").limit(200);
      return q.onSnapshot((snap) => fn(snap.docs.map((d) => ({ id: d.id, ...d.data() }))), onErr);
    },
    set: (c, id, d) => db.collection(c).doc(id).set(d),
    update: (c, id, d) => db.collection(c).doc(id).update(d),
    del: (c, id) => db.collection(c).doc(id).delete(),
    async clear(c) {
      for (;;) {
        const snap = await db.collection(c).limit(500).get();
        if (!snap.docs.length) return;
        for (const d of snap.docs) await db.collection(c).doc(d.id).delete();
      }
    },
  };
}
const short = (v, n = 200) => String(v ?? "").replace(/\s+/g, " ").trim().slice(0, n);
const shortId = (prefix, taken) => {
  for (;;) {
    const id = prefix + Math.random().toString(36).slice(2, 6);
    if (!taken.has(id)) return id;
  }
};

// ---------- Profiles ------------------------------------------------------------
// Each profile (one business, or one area of life) has its own team, tasks, contacts, drafts,
// chat and Airtable table. The first profile ("main") keeps the page's original top-level
// collections, so data saved before profiles existed stays where it was; the others live
// under spaces/<id>/. The list of profiles is the "spaces" collection.
const MAIN = "main";
const spacePath = (id, c) => (id === MAIN ? c : `spaces/${id}/${c}`);
function scoped(base, id) {
  const p = (c) => spacePath(id, c);
  return {
    persistent: base.persistent,
    sub: (c, fn, onErr) => base.sub(p(c), fn, onErr),
    set: (c, i, d) => base.set(p(c), i, d),
    update: (c, i, d) => base.update(p(c), i, d),
    del: (c, i) => base.del(p(c), i),
    clear: (c) => base.clear(p(c)),
  };
}
const spaceName = (id) => S.spaces.find((x) => x.id === id)?.name || (id === S.space && S.profile?.company) || (id === MAIN ? "My first profile" : "New profile");

function openSpace(id) {
  S.unsubs.forEach((u) => { try { u?.(); } catch { /* already closed */ } });
  S.unsubs = [];
  S.space = id;
  try { localStorage.setItem("myops.space", id); } catch { /* per-viewer convenience only */ }
  Object.assign(S, { bots: [], tasks: [], leads: [], outbox: [], chat: [], reports: [], profile: null, memory: null, at: null, atNote: "", loaded: false, editingProfile: false });
  S.store = scoped(S.root, id);
  const onErr = (e) => { if (e?.code !== "unavailable") setStatus("Live updates stopped. Reload the page.", true); };
  const sub = (c, fn) => S.unsubs.push(S.store.sub(c, fn, onErr));
  sub("bots", (rows) => { S.bots = rows; renderTeam(); });
  sub("tasks", (rows) => { S.tasks = rows; renderTasks(); });
  sub("reports", (rows) => { S.reports = rows; renderReports(); });
  sub("leads", (rows) => { S.leads = rows; renderLeads(); });
  sub("config", (rows) => {
    const cfg = rows.find((r) => r.id === "airtable");
    S.at = cfg && cfg.baseId && cfg.tableId && cfg.fields?.sid ? cfg : null;
    S.memory = rows.find((r) => r.id === "memory") || null;
    const prof = rows.find((r) => r.id === "profile");
    S.profile = prof && prof.company ? prof : null;
    S.loaded = true;
    // Profiles saved before the switcher existed get their name in the list here.
    if (S.profile && !S.readOnly && S.root.persistent && S.spaces.find((x) => x.id === id)?.name !== S.profile.company)
      S.root.set("spaces", id, { name: S.profile.company, createdAt: S.spaces.find((x) => x.id === id)?.createdAt || S.profile.createdAt || Date.now() }).catch(() => {});
    $("tagline").textContent = S.profile
      ? `MyOps for ${S.profile.company}: your personal AI team. Tell the Manager what you need; it hires bots through the Recruiter and HR, delegates the work, and queues every message for your sign-off.`
      : "Your personal AI team. Tell the Manager what you need; it hires bots through the Recruiter and HR, delegates the work, and queues every message for your sign-off.";
    renderAirtableButtons(); renderConnections(); renderOperation(); renderChat(); renderSpaces();
  });
  sub("outbox", (rows) => { S.outbox = rows; renderOutbox(); });
  sub("chat", (rows) => {
    const pending = S.chat.filter((m) => String(m.id).startsWith("pending-") && !rows.some((r) => r.at === m.at && r.role === m.role));
    S.chat = [...rows, ...pending]; renderChat();
  });
  renderAll();
}

function draftCard(d) {

    try { await navigator.clipboard.writeText(text); copy.textContent = "Copied"; }
    catch { const r = document.createRange(); r.selectNodeContents(body); getSelection().removeAllRanges(); getSelection().addRange(r); copy.textContent = "Selected"; }
    setTimeout(() => (copy.textContent = "Copy"), 2000);
  };

    if (d.status === "approved") buttons.push(el("button", { className: "btn ghost small", type: "button", textContent: "Mark sent", onclick: act("sent") }));

// A lead found through Clay keeps its Clay search; this reads back the email once Clay has it.
function fetchEmailButton(l) {
  const b = el("button", { className: "btn ghost small", type: "button", textContent: "Fetch email", style: "grid-column:1/-1;justify-self:start" });
  b.onclick = async () => {
    b.disabled = true; b.textContent = "Checking Clay…";
    try {
      const r = await callClay("get-task-context", { taskId: l.clayTask, entityIds: [l.clayEntity] });
      const email = r.contacts?.[0]?.email || "";
      if (email && !email.startsWith("(")) {
        await S.store.update("leads", l.id, { email, updatedAt: Date.now() });
        syncLeads([{ ...l, email }]);
        b.textContent = "Email saved";
      } else { b.textContent = email === "(not found)" ? "Clay found no email" : "Still looking, try later"; b.disabled = email === "(not found)"; if (!b.disabled) setTimeout(() => (b.textContent = "Fetch email"), 3000); }
    } catch (e) { b.textContent = clayError(e).slice(0, 80); b.disabled = false; }
  };
  return b;
}

const errText = (e) => SAMPLE_ERRORS[e?.code] || `Claude didn't answer (${e?.code || "error"}). Try again in a moment.`;
const errDetail = (e) => [e?.code, e?.message].filter(Boolean).join(": ").slice(0, 400);
const parseJson = (text) => {
  const t = String(text || "").trim();
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  const body = fence ? fence[1] : t.slice(Math.min(...["{", "["].map((c) => t.indexOf(c)).filter((i) => i >= 0)), Math.max(t.lastIndexOf("}"), t.lastIndexOf("]")) + 1);
  return JSON.parse(body);
};

// One structured call. If the standard model errors upstream, try once more on the fast model
// with a plain call (parsed here), so one unavailable model doesn't stop the whole team.
async function askJson(prompt, signal, tools) {
  try {
    return await S.sample.json(prompt, tools ? { signal, cache: false, modelTier: S.tier, tools } : { signal, cache: false, modelTier: S.tier });
  } catch (e) {
    if (e?.code !== "upstream_error" || S.tier === "quick" || tools) throw e;
    S.lastError = errDetail(e);
    const { text } = await S.sample(prompt + "\n\nReply with the JSON only.", { signal, cache: false, modelTier: "quick" });
    try { return parseJson(text); } catch { throw { code: "invalid_json", message: "fast-model reply was not JSON", text }; }
  }
}

function step(text) {
  const s = { text, state: "live" };
  S.live.steps.forEach((x) => { if (x.state === "live") x.state = "done"; });
  S.live.steps.push(s); renderChat();
  return { done(t) { s.state = "done"; if (t) s.text = t; renderChat(); }, fail(t) { s.state = "fail"; if (t) s.text = t; renderChat(); } };
}

async function runManager(message, signal) {
  const history = [...S.chat].sort((a, b) => (a.at || 0) - (b.at || 0)).slice(-12).map((m) => ({ role: m.role, text: m.text.slice(0, 1500) }));
  const results = [];
  for (let round = 1; round <= MAX_ROUNDS; round++) {
    const st = step(round === 1 ? "Manager is planning…" : "Manager is reviewing the results…");
    let plan;
    try { plan = await askJson(managerPrompt(history, message, results, round), signal); }
    catch (e) { st.fail(`${round === 1 ? "Manager couldn't start" : "Manager couldn't finish"} (${errDetail(e) || "no details"})`); throw e; }
    const actions = Array.isArray(plan?.actions) ? plan.actions.slice(0, 6) : [];
    st.done(round === 1 ? "Manager made a plan" : "Manager reviewed the results");
    if (!actions.length || round === MAX_ROUNDS) return String(plan?.reply || "Done.");
    if (plan.reply) S.live.text = String(plan.reply);
    for (const a of actions) {
      if (signal.aborted) throw { code: "cancelled" };
      results.push(await runAction(a, signal));
    }
  }
  return "Done.";
}

async function runAction(a, signal) {
  const type = String(a?.type || "");
  if (type === "hire") return hire(String(a.job || ""), String(a.name || ""), signal);
  if (type === "delegate") return delegate(String(a.bot || ""), String(a.task || ""), signal);
  if (type === "ask_cto") return askCto(String(a.question || ""), signal);
  if (type === "fire") {
    const bot = S.bots.find((b) => b.name === a.bot);
    if (!bot) return `fire ${a.bot}: no such bot.`;
    const st = step(`Retiring ${bot.name}…`);
    await S.store.del("bots", bot.id);
    st.done(`${bot.name} retired`);
    return `fire ${bot.name}: retired.`;
  }
  return `Unknown action ${JSON.stringify(a).slice(0, 120)}: skipped.`;
}

const CTO_INTRO = "You are the CTO of MyOps, the owner's personal team of AI bot employees. You own the technology: the Claude models the team runs on, the connections (Clay for company/contact data and web research, Airtable for the contact table), the research data (reports from the MyOps research engine) and which bot tools can work right now.";
async function askCto(question, signal) {

async function ctoReview(job, spec, signal) {

  ].join("\n"), signal);

// Recruiter + HR
function validateSpec(spec) {
  const problems = [];
  const name = String(spec?.name || "").trim().toLowerCase();
  if (!NAME_RE.test(name)) problems.push("name must be 2-32 characters: lowercase letters, digits or _, starting with a letter");
  if (STAFF.some((p) => p.name === name) || S.bots.some((b) => b.name === name)) problems.push(`the name ${name} is taken`);
  if (!String(spec?.role || "").trim()) problems.push("role is empty");
  if (String(spec?.instructions || "").trim().length < 60) problems.push("instructions are too short");
  const tools = Array.isArray(spec?.tools) ? spec.tools.map(String) : [];
  const unknown = tools.filter((t) => !(t in TOOLS));
  if (unknown.length) problems.push(`unknown tools: ${unknown.join(", ")}`);
  return { problems, spec: { name, role: String(spec?.role || "").trim(), instructions: String(spec?.instructions || "").trim(), tools: [...new Set(tools)].filter((t) => t in TOOLS) } };
}

async function hire(job, wanted, signal) {
  if (!job) return "hire: no job description given.";
  let st = step(`Recruiter is designing ${wanted || "a new bot"}…`);
  const recruiterPrompt = (feedback) => [
    `You are the Recruiter on ${orgName()}'s MyOps team of AI bot employees. Design one new bot for this job.`,
    `Who the team works for:\n${profileBrief()}`,
    `Job description from the Manager: ${job}`,
    wanted ? `The Manager would like it named: ${wanted}` : "",
    `Names already taken: ${[...STAFF.map((p) => p.name), ...S.bots.map((b) => b.name)].join(", ")}`,
    `Tools you can grant (grant only what the job needs): ${Object.entries(TOOLS).map(([k, v]) => `${k}: ${v}`).join("; ")}.`,
    "A bot that analyses stocks, markets or other research data needs research_read (it reads the real numbers in the latest research report; it cannot fetch prices itself). A bot whose job is finding leads needs find_leads together with crm_write so it can save what it finds. A bot that researches companies, news or market signals needs web_research (plus crm_write if it should record what it learns on leads). Only find_leads gives a bot access to real company and contact data (through Clay); without it bots cannot browse the web. No bot can send messages; drafted emails and texts wait for the owner's approval.",
    "Write the instructions in the second person: responsibilities, how to work, quality bar, tone for any messages, and limits (never invent contact details, respect consent and anti-spam rules, say what is missing instead of guessing).",
    feedback ? `Your previous design was rejected by validation: ${feedback}. Fix it.` : "",
    'Reply with ONLY a JSON object: {"name": "snake_case", "role": "one line", "instructions": "full instructions", "tools": ["crm_read", ...]}',
  ].filter(Boolean).join("\n");
  let checked;
  try {
    checked = validateSpec(await askJson(recruiterPrompt(""), signal));
    if (checked.problems.length) {
      st.fail(`Recruiter's design needed fixes: ${checked.problems.join("; ")}`);
      st = step("Recruiter is revising the design…");
      checked = validateSpec(await askJson(recruiterPrompt(checked.problems.join("; ")), signal));
    }
  } catch (e) { st.fail("Recruiter couldn't finish"); if (e?.code === "cancelled") throw e; return `hire: the Recruiter failed (${errText(e)}).`; }
  if (checked.problems.length) { st.fail("Recruiter's design was invalid"); return `hire: rejected by validation (${checked.problems.join("; ")}).`; }
  const spec = checked.spec;
  st.done(`Recruiter designed ${spec.name} (${spec.tools.join(", ") || "no tools"})`);

  st = step(`CTO is checking ${spec.name}'s tools…`);
  try {
    const tech = await ctoReview(job, spec, signal);
    if (!tech.approved) { st.fail(`CTO rejected ${spec.name}: ${tech.reason || "no reason given"}`); return `hire ${spec.name}: the CTO rejected it. Reason: ${tech.reason || "none given"}.`; }
    const dropped = spec.tools.filter((t) => tech.drop.includes(t));
    spec.tools = spec.tools.filter((t) => !tech.drop.includes(t));
    st.done(`CTO approved ${spec.name}${dropped.length ? ` (removed ${dropped.join(", ")})` : ""}: ${tech.reason}`.trim());
  } catch (e) { st.fail("CTO couldn't finish the review"); if (e?.code === "cancelled") throw e; return `hire ${spec.name}: CTO review failed (${errText(e)}).`; }

  st = step(`HR is reviewing ${spec.name}…`);
  let verdict;
  try {
    verdict = await askJson([
      `You are HR on ${orgName()}'s MyOps team of AI bot employees. Review this candidate bot before it joins the team.`,
      `Job description: ${job}`,
      `Candidate: ${JSON.stringify(spec)}`,
      "Approve only if: the role matches the job; the instructions are clear, honest and safe (no deception, no spam, respects consent and anti-spam law); and the tools are the minimum the job needs (drafting emails or texts must be justified by the job).",
      'Reply with ONLY a JSON object: {"approved": true or false, "reason": "one or two sentences"}',
    ].join("\n"), signal);
  } catch (e) { st.fail("HR couldn't finish the review"); if (e?.code === "cancelled") throw e; return `hire ${spec.name}: HR review failed (${errText(e)}).`; }
  if (verdict?.approved !== true) {
    st.fail(`HR rejected ${spec.name}: ${verdict?.reason || "no reason given"}`);
    return `hire ${spec.name}: HR rejected it. Reason: ${verdict?.reason || "none given"}.`;
  }
  await S.store.set("bots", spec.name, { ...spec, hiredAt: Date.now(), job });
  S.bots = [...S.bots.filter((b) => b.name !== spec.name), { id: spec.name, ...spec, hiredAt: Date.now() }];
  st.done(`HR approved ${spec.name}: ${verdict.reason || ""}`.trim());
  return `hire ${spec.name}: hired as "${spec.role}" with tools ${spec.tools.join(", ") || "none"}. HR: ${verdict.reason || ""}`;
}

// Clay through the owner's claude.ai connector. Returns sample() tools, or null when Clay can't be used.
// Clay's raw results are large (full descriptions, every office address), so each result is cut
// down to what a bot needs before it is handed back.
function slimClay(r) {
  const out = { taskId: r?.taskId, hasMore: !!r?.hasMore };
  const companies = Object.values(r?.companies || {});
  if (companies.length) out.companies = companies.map((c) => ({
    entityId: c.entityId, name: c.name, domain: c.domain, website: c.website, industry: c.industry,
    size: c.size, location: c.locality, revenue: c.annual_revenue, about: short(c.description, 220),
    ...((c.enrichments || []).length ? { research: c.enrichments.map((e) => ({
      name: e.name, state: e.state, value: e.state === "completed" ? short(researchValue(e.value), 2500) || "(nothing found)" : undefined })) } : {}),
  }));
  const contacts = r?.contacts || [];
  if (contacts.length) out.contacts = contacts.map((p) => {
    const email = (p.enrichments || []).find((e) => /email/i.test(String(e.name || "")));
    return {
      entityId: p.entityId, name: p.name, title: p.latest_experience_title, company: p.latest_experience_company,
      domain: p.domain, linkedin: p.url, location: p.location_name,
      email: email ? (emailValue(email.value) || `(${email.state === "completed" ? "not found" : email.state})`) : undefined,
    };
  });
  return out;
}
// Research answers arrive as text or as JSON (sometimes JSON-encoded); flatten to readable text.
function researchValue(v) {
  if (v == null) return "";
  let x = v;
  if (typeof x === "string" && /^[\[{]/.test(x.trim())) { try { x = JSON.parse(x); } catch { /* keep the string */ } }
  if (typeof x === "object") {
    const vals = Object.values(x);
    x = vals.length === 1 && typeof vals[0] === "string" ? vals[0] : JSON.stringify(x);
  }
  return String(x);
}
// A finished lookup arrives as {"Work Email": "a@b.com"} (sometimes JSON-encoded) or a plain address.
function emailValue(v) {
  if (v == null || v === "") return "";
  let x = v;
  if (typeof x === "string" && x.trim().startsWith("{")) { try { x = JSON.parse(x); } catch { /* keep the string */ } }
  if (typeof x === "object") x = Object.values(x).find((y) => typeof y === "string" && y.includes("@")) || "";
  x = String(x).trim();
  return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x) ? x : "";
}
async function callClay(tool, input, signal) {
  const r = await S.mcp.callTool(CLAY, tool, input, signal ? { signal } : undefined);
  return slimClay(r.payload);
}
const DSL_HELP = [

      inputSchema: { type: "object", properties: { taskId: { type: "string" }, entityIds: { type: "array", items: { type: "string" } } }, required: ["taskId"] },

        "(e.g. \"Are they opening new locations this year? Cite sources.\"). Answers finish in the background, usually within a minute: read them with clay_read_results.",

        const dataPoints = [
          ...(Array.isArray(i.standard) ? i.standard : []).filter((t) => RESEARCH_TYPES.includes(t)).map((type) => ({ type })),
          ...(Array.isArray(i.questions) ? i.questions : []).slice(0, 3).map((q, n) => ({ type: "Custom", dataPointName: short(q, 60) || `Question ${n + 1}`, dataPointDescription: String(q).slice(0, 1000) })),
        ];
        if (!dataPoints.length) dataPoints.push({ type: "Recent News" });
        return callClay("add-company-data-points", { taskId: String(i.taskId), dataPoints, entityIds: (i.entityIds || []).map(String).slice(0, 10) }, sig);
      }) },
  ].filter((t) => ({
    clay_search_companies: true, clay_load_more: true, clay_read_results: true,
    clay_search_contacts: kinds.leads, clay_find_emails: kinds.leads, clay_research_companies: kinds.research,
  })[t.name]);
}
function clayError(e) {
  switch (e?.code) {
    case "server_not_connected": return "Clay is not connected. The owner can add it in claude.ai Settings > Connectors.";
    case "needs_reauth": return "Clay needs to be reconnected in claude.ai Settings > Connectors.";
    case "not_in_manifest": case "approval_required": return "The owner did not allow this page to use Clay.";
    case "tool_error": return `Clay reported an error: ${String(e.message || "").slice(0, 300)}`;
    default: return `Clay call failed (${e?.code || "error"}): ${String(e?.message || "").slice(0, 200)}`;
  }
}

// ---------- Airtable sync ----------------------------------------------------------
// Every lead write in the page is mirrored to the owner's Airtable table, matched on the
// ID column ("MyOps ID"; "Salesbot ID" in older tables) so a contact synced twice updates its row instead of adding one.
const leadTitle = (l) => l.title || (String(l.notes || "").match(/Title:\s*([^.\n]+)/) || [])[1]?.trim() || "";
const leadLinkedin = (l) => (l.linkedin || (String(l.notes || "").match(/https?:\/\/(?:www\.)?linkedin\.com\/in\/[^\s,)]+/) || [])[0] || "").replace(/[.;:]+$/, "");
function atRecord(l) {
  const F = S.at.fields, f = {};
  const put = (k, v) => { if (F[k] && v !== undefined) f[F[k]] = v; };
  put("sid", l.id); put("name", l.name || ""); put("company", l.company || ""); put("title", leadTitle(l));
  put("status", STATUSES.includes(l.status) ? l.status : "new"); put("notes", l.notes || ""); put("addedBy", l.addedBy || "");
  put("linkedin", leadLinkedin(l) || null);
  if (l.email) put("email", l.email);
  if (l.phone) put("phone", l.phone);
  return { fields: f };
}
async function syncLeads(leads) {
  if (!S.at || !S.mcp || !leads.length || S.atState === "absent") return;
  try {
    for (let i = 0; i < leads.length; i += 50) {
      await S.mcp.callTool(AIRTABLE, "update_records_for_table", {
        baseId: S.at.baseId, tableId: S.at.tableId, typecast: true,
        performUpsert: { fieldIdsToMergeOn: [S.at.fields.sid] },
        records: leads.slice(i, i + 50).map(atRecord),
      });
    }
    S.atState = "available";
    S.atNote = `Synced ${leads.length === 1 ? "1 contact" : leads.length + " contacts"} at ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;
  } catch (e) {
    S.atNote = `Sync failed: ${atError(e)}`;
  }
  renderConnections();
}
const syncLeadId = (id) => { const l = S.leads.find((x) => x.id === id); if (l) syncLeads([l]); };
function atError(e) {
  switch (e?.code) {
    case "server_not_connected": return "Airtable is not connected (claude.ai Settings > Connectors).";
    case "needs_reauth": return "Reconnect Airtable in claude.ai Settings > Connectors.";
    case "not_in_manifest": case "approval_required": return "This page wasn't allowed to use Airtable.";
    case "tool_error": return String(e.message || "Airtable error").slice(0, 200);
    default: return `${e?.code || "error"}: ${String(e?.message || "").slice(0, 160)}`;
  }
}
// Airtable rows back to plain {field name: value}; select values come back as {id, name, color}.
function atPlain(rec) {
  const byId = Object.fromEntries(Object.entries(S.at.fields).map(([k, id]) => [id, k]));
  const out = { recordId: rec.id };
  for (const [fid, v] of Object.entries(rec.cellValuesByFieldId || rec.fields || {})) {
    const k = byId[fid] || fid;
    out[k] = v && typeof v === "object" && !Array.isArray(v) ? (v.name ?? JSON.stringify(v)) : v;
  }
  return out;
}
async function atList() {
  const r = await S.mcp.callTool(AIRTABLE, "list_records_for_table", {
    baseId: S.at.baseId, tableId: S.at.tableId, pageSize: 500, fieldIds: Object.values(S.at.fields) });
  return (r.payload?.records || []).map(atPlain);
}
async function importFromAirtable(btn) {
  if (!S.at || !S.mcp) return;
  btn.disabled = true; btn.textContent = "Importing…";
  try {
    const rows = await atList();
    const taken = new Set(S.leads.map((l) => l.id));
    const fresh = [];
    for (const r of rows) {
      if (r.sid && taken.has(r.sid)) continue;
      if (!String(r.name || "").trim()) continue;
      const id = r.sid && /^L[a-z0-9]{4}$/.test(r.sid) ? r.sid : shortId("L", taken); taken.add(id);
      const lead = { name: String(r.name).slice(0, 200), company: String(r.company || ""), title: String(r.title || ""), email: String(r.email || ""),
        phone: String(r.phone || ""), linkedin: String(r.linkedin || ""), status: STATUSES.includes(r.status) ? r.status : "new",
        notes: String(r.notes || "").slice(0, 2000), createdAt: Date.now(), updatedAt: Date.now(), addedBy: "airtable import" };
      await S.store.set("leads", id, lead);
      fresh.push({ id, ...lead, recordId: r.recordId });
    }
    // Rows added straight to Airtable (for example by OpenClaw) have no MyOps ID yet: write it
    // into that same row so the next sync updates it instead of adding a copy.
    for (let i = 0; i < fresh.length; i += 50) {
      await S.mcp.callTool(AIRTABLE, "update_records_for_table", {
        baseId: S.at.baseId, tableId: S.at.tableId, typecast: true,
        records: fresh.slice(i, i + 50).map((l) => ({ id: l.recordId, ...atRecord(l) })),
      });
    }
    btn.textContent = fresh.length ? `Imported ${fresh.length}` : "Nothing new";
  } catch (e) { btn.textContent = "Import failed"; S.atNote = `Import failed: ${atError(e)}`; renderConnections(); }
  setTimeout(() => { btn.textContent = "Import from Airtable"; btn.disabled = false; }, 3000);
}
// A fresh copy has no Airtable table yet: this makes a new base with a Leads table in the
// owner's first Airtable workspace, saves where it is, and syncs the contact book into it.
const AT_FIELDS = [
  ["name", "Name", "singleLineText"], ["company", "Company", "singleLineText"], ["title", "Title", "singleLineText"],
  ["email", "Email", "email"], ["phone", "Phone", "phoneNumber"], ["status", "Status", "singleSelect"],
  ["linkedin", "LinkedIn", "url"], ["notes", "Notes", "multilineText"], ["addedBy", "Added by", "singleLineText"], ["sid", "MyOps ID", "singleLineText"],
];
async function setupAirtable(btn) {
  btn.disabled = true; btn.textContent = "Creating the table…";
  try {
    const ws = (await S.mcp.callTool(AIRTABLE, "list_workspaces", {})).payload?.workspaces || [];
    const w = ws.find((x) => ["owner", "create"].includes(x.permissionLevel)) || ws[0];
    if (!w) throw { code: "tool_error", message: "No Airtable workspace found on this account." };
    const baseName = `${orgName() === "the owner" ? "MyOps" : orgName()} CRM`.slice(0, 80);
    const r = (await S.mcp.callTool(AIRTABLE, "create_base", { workspaceId: w.id, name: baseName, tables: [{
      name: "Leads", description: "Contacts managed by the MyOps team. MyOps ID links each row to the contact in the MyOps page.",
      fields: AT_FIELDS.map(([, name, type]) => type === "singleSelect"
        ? { name, type, options: { choices: STATUSES.map((c) => ({ name: c })) } } : { name, type }),
    }] })).payload;
    const t = r?.tables?.[0];
    const byName = Object.fromEntries((t?.fields || []).map((f) => [f.name, f.id]));
    const cfg = { baseId: r?.id, tableId: t?.id, baseName, fields: Object.fromEntries(AT_FIELDS.map(([k, name]) => [k, byName[name]])), createdAt: Date.now() };
    if (!cfg.baseId || !cfg.tableId || !cfg.fields.sid) throw { code: "tool_error", message: "Airtable didn't return the new table." };
    await S.store.set("config", "airtable", cfg);
    S.at = cfg; S.atState = "available";
    await syncLeads(S.leads);
  } catch (e) { S.atNote = `Setup failed: ${atError(e)}`; btn.disabled = false; btn.textContent = "Create an Airtable lead table"; }
  renderAirtableButtons(); renderConnections();
}
function renderAirtableButtons() {

function airtableToolsFor(botName) {
  if (!S.at || !S.mcp || S.atState === "absent") return [];
  const run = (label, fn) => async (input) => {
    const st = step(`${botName}: ${label}…`);
    try { const r = await fn(input); st.done(`${botName}: ${label} done`); return r; }
    catch (e) { st.fail(`${botName}: ${label} failed (${e?.code || "error"})`); throw new Error(atError(e)); }
  };
  return [
    { name: "airtable_search_leads", description: "Free-text search of the owner's Airtable contact table (name, company, title, email, notes). Returns matching rows.",
      inputSchema: { type: "object", properties: { query: { type: "string" } }, required: ["query"] },
      execute: run("searching Airtable", async (i) => {
        const r = await S.mcp.callTool(AIRTABLE, "search_records", { baseId: S.at.baseId, table: S.at.tableId, query: String(i.query || ""), fields: "ALL_SEARCHABLE_FIELDS", limit: 50 });
        return (r.payload?.records || []).map(atPlain);
      }) },
    { name: "airtable_list_leads", description: "List rows in the owner's Airtable contact table, optionally only one status (new, contacted, qualified, proposal, won, lost).",
      inputSchema: { type: "object", properties: { status: { type: "string" } } },
      execute: run("reading Airtable", async (i) => {
        const rows = await atList();
        return (i.status ? rows.filter((r) => r.status === i.status) : rows).slice(0, 200);
      }) },
  ];
}

// Every delegation is logged on the Tasks board with its outcome.
async function delegate(name, task, signal) {
  const bot = S.bots.find((b) => b.name === name);
  if (!bot) return `delegate to ${name}: no such bot on the team.`;
  const n = Math.max(0, ...S.tasks.map((t) => t.n || 0)) + 1;
  const id = `t${n}`, doc = { n, bot: bot.name, brief: task.slice(0, 4000), status: "working", createdAt: Date.now() };
  S.tasks.push({ id, ...doc });
  S.store.set("tasks", id, doc).catch(showStoreError);
  let result = "", failed = true;
  try {
    result = await delegateWork(bot, task, signal);
    failed = result.startsWith(`delegate to ${bot.name}: failed`);
    return result;
  } catch (e) { result = errText(e); throw e; }
  finally {
    const report = result.replace(`delegate to ${bot.name}: `, "").slice(0, 3000);
    S.store.update("tasks", id, { status: failed ? "failed" : "done", report, finishedAt: Date.now() }).catch(() => {});
  }
}

// A worker bot: one structured call, then the page applies what it is allowed to do.
async function delegateWork(bot, task, signal) {
  const tools = new Set(bot.tools || []);
  const st = step(`${bot.name} is working…`);
  const canRead = tools.has("crm_read") || tools.has("crm_write");
  const clayTools = [
    ...(tools.has("find_leads") || tools.has("web_research")
      ? (await clayToolsFor(bot.name, { leads: tools.has("find_leads"), research: tools.has("web_research") })) || [] : []),
    ...(tools.has("airtable") ? airtableToolsFor(bot.name) : []),
  ];
  const shape = {
    report: "what you did and anything the Manager should know (plain text)",
    ...(tools.has("crm_write") ? {
      add_leads: [{ name: "", company: "", title: "", email: "", phone: "", linkedin: "", status: "new", notes: "", ...(tools.has("find_leads") ? { clay_task_id: "optional", clay_entity_id: "optional" } : {}) }],
      update_leads: [{ id: "lead id", status: "optional", notes: "optional, replaces notes" }],
    } : {}),
    ...(tools.has("draft_email") || tools.has("draft_sms") ? {
      drafts: [{ kind: [tools.has("draft_email") && "email", tools.has("draft_sms") && "sms"].filter(Boolean).join(" or "), to: "address or phone", subject: "email only", body: "", lead_id: "optional" }],
    } : {}),
  };
  let out;
  try {
    out = await askJson([
      `You are ${bot.name}, a bot employee on ${orgName()}'s MyOps team. Your role: ${bot.role}.`,
      `Who you work for:\n${profileBrief()}`,
      `Your instructions:\n${bot.instructions}`,
      `You can: ${[...tools].map((t) => TOOLS[t]).join("; ") || "only report back"}. You cannot send anything.`,
      clayTools.some((t) => t.name.startsWith("airtable_")) ? "Use the Airtable tools to look up contacts the owner keeps in Airtable. Contacts you add or update in the contact book are copied to Airtable automatically, so don't try to write to Airtable yourself." : "",
      clayTools.some((t) => t.name === "clay_research_companies") ? "For research, find the companies with clay_search_companies, ask clay_research_companies for recent news, open jobs or your own questions, then read the answers with clay_read_results (call it again if they are still in-progress). Base claims only on what the research returned and mention the sources it gives. Research uses Clay credits: research at most 10 companies per task." : "",
      clayTools.some((t) => t.name === "clay_search_contacts") ? "Use the Clay tools to find real companies that match the people the owner works with and the right decision-makers there, then ask Clay for their emails and read the results. Only record companies, people and emails that Clay returned. Save every person you find as a lead even if the email is still pending: put their title and LinkedIn URL in notes, and set clay_task_id and clay_entity_id so the owner can fetch the email later. Keep searches focused (limit 10-25) to save Clay credits." : (tools.has("find_leads") || tools.has("web_research") ? "Your Clay tools are not available right now (the Clay connector is not connected or was not allowed). Say so in your report and do not invent leads." : "You cannot browse the web."),
      canRead ? `Contact book (JSON): ${JSON.stringify(leadDigest())}` : "",
      tools.has("research_read") && reportDigest() ? `Latest research report (real market data; use only these numbers, never invent prices or financials, and note the report date):\n${JSON.stringify(reportDigest())}` : "",
      tools.has("research_read") && !reportDigest() ? "There is no research report yet: say so and do not invent market data." : "",
      `Task from the Manager:\n${task}`,
      "Do the task now. Never invent contact details: only use addresses and numbers given to you or already in the contact book. Leave lists empty when there is nothing to add.",
      `Reply with ONLY a JSON object in this shape: ${JSON.stringify(shape)}`,
    ].filter(Boolean).join("\n\n"), signal, clayTools.length ? clayTools : null);
  } catch (e) { st.fail(`${bot.name} couldn't finish (${errDetail(e) || "no details"})`); if (e?.code === "cancelled") throw e; return `delegate to ${bot.name}: failed (${errText(e)}).`; }

  const did = [];
  const changed = [];
  if (tools.has("crm_write")) {
    const taken = new Set(S.leads.map((l) => l.id));
    for (const l of (Array.isArray(out?.add_leads) ? out.add_leads : []).slice(0, 50)) {
      if (!l || !String(l.name || "").trim()) continue;
      const id = shortId("L", taken); taken.add(id);
      const lead = { name: String(l.name).slice(0, 200), company: String(l.company || "").slice(0, 200), email: String(l.email || "").slice(0, 200), phone: String(l.phone || "").slice(0, 60),
        status: STATUSES.includes(l.status) ? l.status : "new", notes: String(l.notes || "").slice(0, 2000), createdAt: Date.now(), updatedAt: Date.now(), addedBy: bot.name,
        title: String(l.title || "").slice(0, 200), linkedin: String(l.linkedin || "").slice(0, 300),
        ...(l.clay_task_id && l.clay_entity_id ? { clayTask: String(l.clay_task_id).slice(0, 100), clayEntity: String(l.clay_entity_id).slice(0, 100) } : {}) };
      await S.store.set("leads", id, lead);
      if (!S.leads.some((x) => x.id === id)) S.leads.push({ id, ...lead });
      changed.push({ id, ...lead });
      did.push(`added lead ${id} ${lead.name}`);
    }
    for (const u of (Array.isArray(out?.update_leads) ? out.update_leads : []).slice(0, 50)) {
      const lead = S.leads.find((l) => l.id === u?.id);
      if (!lead) continue;
      const patch = { updatedAt: Date.now() };
      if (STATUSES.includes(u.status)) patch.status = u.status;
      if (typeof u.notes === "string" && u.notes.trim()) patch.notes = u.notes.slice(0, 2000);
      await S.store.update("leads", lead.id, patch);
      changed.push({ ...lead, ...patch });
      did.push(`updated lead ${lead.id}`);
    }
  }
  if (changed.length) syncLeads(changed);
  let n = Math.max(0, ...S.outbox.map((d) => d.n || 0));
  for (const d of (Array.isArray(out?.drafts) ? out.drafts : []).slice(0, 30)) {
    const kind = d?.kind === "sms" ? "sms" : "email";
    if (!tools.has(kind === "sms" ? "draft_sms" : "draft_email") || !String(d.to || "").trim() || !String(d.body || "").trim()) continue;
    n += 1;
    const id = `d${n}`;
    const draft = { n, kind, to: String(d.to).slice(0, 200), subject: kind === "email" ? String(d.subject || "").slice(0, 300) : "", body: String(d.body).slice(0, 5000),
      lead: String(d.lead_id || ""), bot: bot.name, status: "pending", createdAt: Date.now() };
    await S.store.set("outbox", id, draft);
    if (!S.outbox.some((x) => x.id === id)) S.outbox.push({ id, ...draft });
    did.push(`drafted ${kind} #${n} to ${draft.to}`);
  }
  st.done(`${bot.name} finished${did.length ? ": " + did.join(", ") : ""}`);
  return `delegate to ${bot.name}: ${String(out?.report || "no report").slice(0, 1500)}${did.length ? " | Changes: " + did.join("; ") : ""}`;
}

// ---------- Sending a message ---------------------------------------------------
async function send(text) {
  text = String(text || "").trim();
  if (!text || S.busy || !S.sample || S.readOnly) return;
  $("input").value = "";
  notice("");
  S.busy = true; S.ctl = new AbortController();
  S.live = { text: "", steps: [] };
  const at = Date.now();
  S.chat.push({ id: "pending-user", role: "user", text, at });
  syncCompose(); renderChat();
  S.store.set("chat", `m${at}u`, { role: "user", text, at }).catch(showStoreError);
  let reply, steps;
  try {
    reply = await runManager(text, S.ctl.signal);
  } catch (e) {
    reply = errText(e);
    if (e?.code && e.code !== "cancelled") notice(reply, true);
  } finally {
    steps = (S.live?.steps || []).map((s) => ({ text: s.text, state: s.state === "live" ? "fail" : s.state }));
    S.live = null; S.busy = false; S.ctl = null;
    S.chat = S.chat.filter((m) => m.id !== "pending-user");
  }
  const doc = { role: "manager", text: reply, steps, at: Date.now() };
  S.chat.push({ id: "pending-mgr", ...doc });
  await S.store.set("chat", `m${doc.at}m`, doc).catch(showStoreError);
  S.chat = S.chat.filter((m) => m.id !== "pending-mgr");
  renderAll();
  updateMemory().catch(() => {});
}

// Long-term memory: chat turns older than the 12 the Manager sees are folded (in batches) into a
// summary at config/memory, so the thread survives long chats and a switch between Claude tiers.
const RECENT_TURNS = 12, MEMORY_BATCH = 6;
async function updateMemory() {
  if (!S.sample || S.readOnly) return;
  const msgs = [...S.chat].filter((m) => !String(m.id).startsWith("pending")).sort((a, b) => (a.at || 0) - (b.at || 0));
  const upto = S.memory?.upto || 0;
  const older = msgs.slice(0, -RECENT_TURNS).filter((m) => (m.at || 0) > upto);
  if (older.length < MEMORY_BATCH) return;
  const transcript = older.map((m) => `${m.role === "user" ? "Owner" : "Manager"}: ${String(m.text).slice(0, 1200)}`).join("\n");
  let summary;
  try {
    const { text } = await S.sample([
      "You keep the long-term memory of an owner's chat with the Manager of their AI team. Merge the new turns into the memory.",
      "Keep goals, preferences and standing instructions, decisions, important names and numbers, work done by which bot, and open tasks. Drop small talk and anything superseded. Plain bullet points, at most 3000 characters. Reply with the memory only.",
      `Current memory:\n${S.memory?.summary || "(empty)"}`, `New turns:\n${transcript}`,
    ].join("\n\n"), { cache: false, modelTier: "quick" });
    summary = String(text || "").trim();
  } catch { summary = ""; }
  if (!summary) summary = `${S.memory?.summary || ""}\n${transcript}`.trim();
  const doc = { summary: summary.slice(-4000), upto: older[older.length - 1].at, updatedAt: Date.now() };
  S.memory = { id: "memory", ...doc };
  await S.store.set("config", "memory", doc);
}

  b.disabled = true; notice("Checking Claude…");
  const results = [];
  for (const tier of ["default", "quick"]) {
    try {
      const r = await S.sample("Reply with exactly: OK", { cache: false, modelTier: tier });
      results.push(`${tier}: OK (answered by ${r.modelTierApplied})`);
    } catch (e) { results.push(`${tier}: ${errDetail(e) || "failed"}`); }
  }
  const ok = results.filter((r) => r.includes(": OK"));
  S.tier = ok.length && !results[0].includes(": OK") ? "quick" : "default";
  notice(`Claude check: ${results.join(" · ")}${S.tier === "quick" ? " · The team will use the fast model." : ""}`, !ok.length);
  S.store.set("diagnostics", "last", { at: Date.now(), results }).catch(() => {});
  b.disabled = false;
});
$("spaceSel").addEventListener("change", (e) => {
  const v = e.target.value;
  if (S.busy) { renderSpaces(); return; }
  if (v === "__new") newSpace(); else openSpace(v);
});
$("hireForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const job = $("hireInput").value.trim();
  if (!job) return;
  $("hireInput").value = "";
  showPane("pane-chat");
  send(`Hire a bot for this job: ${job}`);
});
$("leadSearch").addEventListener("input", renderLeads);
$("atSyncBtn").addEventListener("click", async (e) => {
  const b = e.currentTarget; b.disabled = true; b.textContent = "Syncing…";
  await syncLeads(S.leads);
  b.textContent = "Sync to Airtable"; b.disabled = false;
});
$("atImportBtn").addEventListener("click", (e) => importFromAirtable(e.currentTarget));
$("atSetupBtn").addEventListener("click", (e) => setupAirtable(e.currentTarget));
document.querySelectorAll(".subtabs button").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll(".subtabs button").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
  for (const k of ["outbox", "tasks", "reports", "leads"]) $(`sub-${k}`).hidden = b.dataset.sub !== k;
  $("rightMeta").hidden = b.dataset.sub !== "leads";
}));
function showPane(id) {
  document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-selected", String(x.dataset.pane === id)));
  document.querySelectorAll("main > .pane").forEach((p) => p.classList.toggle("show", p.id === id));
}
document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => showPane(b.dataset.pane)));

// ---------- Boot ----------------------------------------------------------------------
S.root = memoryStore();
S.store = scoped(S.root, MAIN);
renderAll();
(async () => {
  const claude = window.claude;
  const [sample, db, user, mcp] = await Promise.all([
    claude?.use("sample") ?? null, claude?.use("db") ?? null, claude?.use("user") ?? null, claude?.use("mcp") ?? null,
  ]);
  S.sample = sample; S.mcp = mcp;
  if (!mcp) S.clay = "absent";
  else mcp.listTools(CLAY).then((r) => { S.clay = r?.servers?.length && r.servers[0].tools?.length ? "available" : "absent"; renderConnections(); })
    .catch(() => { S.clay = "absent"; renderConnections(); });
  if (db) {
    S.root = dbStore(db);
    const canWrite = user ? await user.can("data.write").catch(() => null) : null;
    S.readOnly = canWrite === false;
  }
  if (!mcp) S.atState = "absent";
  else mcp.listTools(AIRTABLE).then((r) => { S.atState = r?.servers?.length && r.servers[0].tools?.length ? "available" : "absent"; renderConnections(); renderAirtableButtons(); })
    .catch(() => { S.atState = "absent"; renderConnections(); renderAirtableButtons(); });
  S.root.sub("spaces", (rows) => {
    S.spaces = rows;
    // The open profile was deleted (here or by someone else): go back to the main one.
    if (S.space !== MAIN && !rows.some((x) => x.id === S.space) && !S.busy) openSpace(MAIN);
    else renderSpaces();
  }, () => {});
  openSpace(savedSpace());
  if (!sample) setStatus("Preview: open in claude.ai to run the team", true);
  else if (!db) setStatus("Preview: nothing is saved here", true);
  else if (S.readOnly) setStatus("View only", false);
  else setStatus("Team on duty · saved to this page", false);
  renderAll();
})();
</script>
