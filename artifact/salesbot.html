<title>MyOps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout (Kimi-style): a quiet sidebar for navigation, one centered conversation column with a large rounded
   composer, answers as plain text and only your messages in bubbles. Other sections open in the same column.
   Phones get the sidebar as a slide-in drawer. */
:root {
  --bg: #ffffff;
  --side: #f7f8fa;
  --surface: #ffffff;
  --ink: #1d1e20;
  --muted: #7c818b;
  --line: #ebedf0;
  --accent: #1783ff;        /* links, focus, selection */
  --accent-ink: #ffffff;
  --accent-soft: #e8f2ff;
  --staff: #1d1e20;
  --staff-soft: #eef0f3;
  --good: #16a34a;
  --good-soft: #e7f6ec;
  --bad: #dc2626;
  --bad-soft: #fdecec;
  --me: #f2f3f5;            /* your bubble */
  --me-ink: #1d1e20;
  --bubble: #f2f3f5;
  --hover: #eef0f3;
  --shadow: 0 6px 24px rgba(20, 24, 31, 0.07), 0 1px 3px rgba(20, 24, 31, 0.06);
  --display: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  --body: var(--display);
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141416; --side: #1b1b1e; --surface: #1f1f23; --ink: #ececf1; --muted: #9a9ca5; --line: #2c2d32;
    --accent: #4b9dff; --accent-ink: #0b1220; --accent-soft: #16263b;
    --staff: #ececf1; --staff-soft: #2a2b30; --good: #4ade80; --good-soft: #15291c;
    --bad: #f87171; --bad-soft: #3a1d1d; --me: #2a2b30; --me-ink: #ececf1; --bubble: #2a2b30; --hover: #26272c;
    --shadow: 0 6px 24px rgba(0, 0, 0, 0.35), 0 1px 3px rgba(0, 0, 0, 0.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141416; --side: #1b1b1e; --surface: #1f1f23; --ink: #ececf1; --muted: #9a9ca5; --line: #2c2d32;
  --accent: #4b9dff; --accent-ink: #0b1220; --accent-soft: #16263b;
  --staff: #ececf1; --staff-soft: #2a2b30; --good: #4ade80; --good-soft: #15291c;
  --bad: #f87171; --bad-soft: #3a1d1d; --me: #2a2b30; --me-ink: #ececf1; --bubble: #2a2b30; --hover: #26272c;
  --shadow: 0 6px 24px rgba(0, 0, 0, 0.35), 0 1px 3px rgba(0, 0, 0, 0.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.25; text-wrap: balance; font-weight: 650; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Shell: sidebar + stage */
.app { display: flex; height: 100%; }
.side {
  width: 248px; flex: none; background: var(--side); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 6px; padding: 14px 10px max(12px, env(safe-area-inset-bottom, 0px));
  padding-left: max(10px, env(safe-area-inset-left, 0px));
}
.brand { display: flex; align-items: center; gap: 9px; padding: 2px 8px 10px; }
.brand .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.brand b { font-size: 18px; letter-spacing: -0.01em; flex: 1; }
.new-chat {
  display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px;
  padding: 9px 12px; font-weight: 600; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}
.new-chat:hover { background: var(--hover); }
.nav { display: flex; flex-direction: column; gap: 1px; margin-top: 8px; overflow-y: auto; min-height: 0; flex: 1; }
.nav .group { font-size: 12px; color: var(--muted); padding: 12px 10px 4px; }
.nav button {
  display: flex; align-items: center; gap: 10px; border: 0; background: none; border-radius: 10px; padding: 8px 10px;
  font-size: 14px; color: var(--ink); text-align: left; width: 100%;
}
.nav button:hover { background: var(--hover); }
.nav button[aria-selected="true"] { background: var(--hover); font-weight: 600; }
.nav button svg.i { color: var(--muted); }
.nav button[aria-selected="true"] svg.i { color: var(--ink); }
.nav button .count { margin-left: auto; }
.nav button.nav-more { color: var(--muted); font-size: 13px; padding: 6px 10px; margin-top: 4px; }
.compose-note:empty { display: none; }
.side-foot { border-top: 1px solid var(--line); padding: 10px 4px 0; display: flex; flex-direction: column; gap: 6px; }
.side-foot .row { display: flex; gap: 6px; align-items: center; }
.space-sel { width: 100%; padding: 7px 10px; font-size: 14px; font-weight: 600; border-radius: 10px; background: var(--surface); }
.status { font-family: var(--mono); font-size: 11.5px; color: var(--muted); padding: 0 6px; }
.status.bad { color: var(--bad); }
.scrim { display: none; }

.stage { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
header.top {
  display: flex; align-items: center; gap: 10px; padding: 10px 20px; min-height: 52px;
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
header.top h1 { font-size: 16px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tagline { display: none; }
.icon-btn { border: 0; background: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--ink); position: relative; flex: none; }
.icon-btn:hover { background: var(--hover); }
.icon-btn .count { position: absolute; top: 2px; right: 0; margin: 0; }
#menuBtn { display: none; }

main { flex: 1; min-height: 0; display: flex; }
.pane { flex: 1; min-width: 0; min-height: 0; display: none; flex-direction: column; }
.pane.show { display: flex; }
.pane > .head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  width: 100%; max-width: 860px; margin: 0 auto; padding: 4px 20px 10px;
}
.pane > .head h2 { font-size: 22px; }
.eyebrow { font-size: 12px; color: var(--muted); font-weight: 500; }
.scroll { overflow-y: auto; min-height: 0; flex: 1; }
.col { width: 100%; max-width: 860px; margin: 0 auto; padding: 4px 20px 24px; }
.subtabs { display: none; }
#pane-right > .scroll { padding: 4px max(20px, calc((100% - 820px) / 2)) 24px; }

/* Staff badges */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.badge {
  border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--surface);
  display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 2px 12px; align-items: start;
}
.badge .mark {
  grid-row: span 3; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 700; font-size: 14px; background: var(--accent-soft); color: var(--accent);
}
.screen-conds { display: flex; flex-direction: column; gap: 4px; }
.screen-cond { display: flex; gap: 6px; align-items: center; font-size: 13px; }
.screen-cond > span { flex: 1; min-width: 0; }
.screen-cond input, .screen-cond select { width: auto; flex: 0 0 auto; padding: 4px 6px; font-size: 13px; }
.screen-cond input { width: 64px; }
.screen-cond select.add { flex: 1; }
.screen-table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.screen-table th { text-align: left; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); padding: 6px 4px; }
.screen-table td { border-bottom: 1px solid var(--line); padding: 6px 4px; }
.screen-table tr:hover td { background: var(--hover); }
.screen-table .up { color: var(--good); } .screen-table .down { color: var(--bad); }
.mode-switch { display: inline-flex; gap: 2px; background: var(--bubble); border-radius: 999px; padding: 3px; }
.mode-switch button { border: 0; background: transparent; font-weight: 600; font-size: 13px; padding: 4px 12px; border-radius: 999px; color: var(--muted); white-space: nowrap; }
.mode-switch button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
.quick { display: flex; gap: 6px; flex-wrap: wrap; width: 100%; max-width: 820px; margin: 0 auto; padding: 0 20px 8px; }
.quick button { font-size: 13px; }
.dev-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.dev-preview { border: 1px dashed var(--accent); border-radius: 12px; padding: 10px; margin-top: 8px; font-size: 13px; }
.team-group { display: flex; flex-direction: column; gap: 10px; }
.team-name { font-size: 13px; font-weight: 600; color: var(--muted); margin-top: 6px; }
.badge.staff .mark { background: var(--staff-soft); color: var(--staff); }
.badge .name { font-weight: 600; display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
.badge .name code { font-family: var(--mono); font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
.badge .role { color: var(--muted); font-size: 13px; line-height: 1.45; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.chip { font-family: var(--mono); font-size: 11px; padding: 1px 7px; border-radius: 6px; background: var(--bubble); color: var(--muted); }
.section-label { margin: 22px 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
.fire { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 0 2px; }
.fire:hover, .fire.armed { color: var(--bad); }
.hire-form { display: flex; flex-direction: column; gap: 8px; margin-top: 22px; max-width: 560px; }
.conn-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
.hire-form textarea { min-height: 70px; }

/* Chat */
#pane-chat { position: relative; }
#chatScroll { display: flex; flex-direction: column; }
.log { display: flex; flex-direction: column; gap: 22px; width: 100%; max-width: 820px; margin: 0 auto; padding: 12px 20px 28px; }
.msg { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.msg .who { display: none; }
.msg .text { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.7; }
.msg.user { align-self: flex-end; align-items: flex-end; max-width: 80%; }
.msg.user .text { background: var(--me); color: var(--me-ink); padding: 9px 16px; border-radius: 20px; }
.msg.manager { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 6px 12px; align-items: start; }
.msg.manager > * { grid-column: 2; }
.msg.manager::before {
  content: attr(data-mark); grid-column: 1; grid-row: 1 / span 4; width: 30px; height: 30px; border-radius: 50%;
  background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 13px;
}
.msg.working .text { color: var(--muted); }
.msg.working .text::after { content: ""; display: inline-block; width: 7px; height: 7px; margin-left: 6px; border-radius: 50%; background: var(--accent); animation: pulse 0.9s infinite alternate; vertical-align: middle; }
.steps { list-style: none; margin: 0; padding: 8px 12px; display: flex; flex-direction: column; gap: 3px; border-left: 2px solid var(--line); }
.steps li { font-size: 13px; color: var(--muted); padding-left: 16px; position: relative; }
.steps li::before { content: ""; position: absolute; left: 2px; top: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.steps li.done::before { background: var(--good); }
.steps li.fail::before { background: var(--bad); }
.steps li.live::before { background: var(--accent); animation: pulse 1s infinite alternate; }
@keyframes pulse { to { opacity: 0.3; } }
@media (prefers-reduced-motion: reduce) { .steps li.live::before, .msg.working .text::after { animation: none; } }
details.steps-wrap summary {
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer;
  background: var(--bubble); border-radius: 999px; padding: 3px 12px; list-style: none;
}
details.steps-wrap summary::-webkit-details-marker { display: none; }
details.steps-wrap summary::after { content: "▾"; font-size: 11px; }
details.steps-wrap[open] summary::after { content: "▴"; }
details.steps-wrap[open] .steps { margin-top: 8px; }

.empty { margin: auto 0 0; text-align: center; color: var(--muted); padding: 24px 0 4px; }
.empty h3 { color: var(--ink); font-size: 28px; font-weight: 650; letter-spacing: -0.02em; margin-bottom: 8px; }
.empty p { max-width: 560px; margin: 0 auto; font-size: 14px; }
.suggest { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin-top: 22px; text-align: left; }
.suggest button {
  border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.45;
  color: var(--ink); text-align: left;
}
.suggest button:hover { background: var(--hover); }
.setup { margin: auto; width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 12px; padding: 16px 0; }
.setup h3 { font-size: 26px; }
.setup p { color: var(--muted); font-size: 14px; margin: 0; }
.setup label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; }
.setup label.check { flex-direction: row; align-items: center; gap: 8px; font-weight: 500; }
.setup label.check input { width: auto; }
.setup textarea { min-height: 70px; resize: vertical; }
.setup input, .setup textarea { font-weight: 400; }
.setup .row { display: flex; gap: 8px; flex-wrap: wrap; }
.op { font-size: 14px; display: flex; flex-direction: column; gap: 6px; }
.op .row { display: flex; gap: 6px; flex-wrap: wrap; }

/* The composer: one big rounded card, controls in a row underneath the text. */
.compose-wrap { width: 100%; max-width: 820px; margin: 0 auto; padding: 0 20px max(14px, env(safe-area-inset-bottom, 0px)); }
.compose {
  display: flex; flex-direction: column; gap: 6px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 24px; padding: 12px 12px 10px 16px; box-shadow: var(--shadow);
}
.compose:focus-within { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.compose textarea { resize: none; min-height: 48px; max-height: 200px; border: 0; background: transparent; padding: 4px 0; font-size: 15.5px; line-height: 1.55; }
.compose textarea:focus { outline: none; }
.compose-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.compose-bar .grow { flex: 1; }
.refine-box { display: inline-flex; align-items: center; gap: 4px; }
.pill-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 5px; color: var(--ink); white-space: nowrap;
}
.pill-btn:hover:not(:disabled) { background: var(--hover); }
.pill-btn:disabled { opacity: 0.5; cursor: default; }
.refine-box .auto { font-size: 12.5px; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; cursor: pointer; padding: 0 4px; }
.refine-box .auto input { width: auto; margin: 0; }
.send {
  width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--ink); color: var(--bg); display: grid; place-items: center; flex: none;
}
.send:disabled { opacity: 0.3; cursor: default; }
.send.stop svg { fill: currentColor; stroke: none; }
.compose-note { text-align: center; font-size: 12px; color: var(--muted); padding-top: 8px; }
#pane-chat.fresh #chatScroll { flex: 0 1 auto; margin-top: auto; }
#pane-chat.fresh .compose-wrap { margin-bottom: auto; padding-bottom: 6vh; }
#pane-chat.fresh .log { padding-bottom: 18px; }
.suggest-host:empty { display: none; }
#pane-chat:not(.fresh) .suggest-host { display: none; }
.msg .refined { font-size: 12.5px; opacity: 0.8; margin-top: 6px; border-top: 1px solid var(--line); padding-top: 6px; white-space: pre-wrap; }

textarea, input, select {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px;
}
.btn {
  border: 1px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 999px;
  padding: 8px 18px; font-weight: 600; white-space: nowrap;
}
.btn.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.ghost:hover:not(:disabled) { background: var(--hover); }
.btn.small { padding: 4px 12px; font-size: 13px; }
.btn:disabled { opacity: 0.5; cursor: default; }
.notice { font-size: 13px; color: var(--muted); width: 100%; max-width: 820px; margin: 0 auto; padding: 0 24px 8px; }
.notice.bad { color: var(--bad); }

/* Sections */
.count { font-size: 11px; font-weight: 600; background: var(--accent); color: var(--accent-ink); border-radius: 99px; padding: 0 7px; margin-left: 4px; line-height: 18px; }
.count[hidden] { display: none; }
.draft { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); }
.draft.pending { border-left: 3px solid var(--accent); }
.draft .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.draft .to { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
.draft .subject { font-weight: 600; }
.draft .body { white-space: pre-wrap; font-size: 14px; overflow-wrap: anywhere; }
.draft .row { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font-size: 11.5px; font-weight: 500; padding: 1px 8px; border-radius: 99px; background: var(--bubble); color: var(--muted); }
.pill.pending { background: var(--accent-soft); color: var(--accent); }
.pill.approved, .pill.sent { background: var(--good-soft); color: var(--good); }
.pill.rejected { background: var(--bad-soft); color: var(--bad); }
.filter { display: flex; gap: 6px; margin-bottom: 12px; }
.lead { border-bottom: 1px solid var(--line); padding: 10px 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; }
.lead .n { font-weight: 600; overflow-wrap: anywhere; }
.lead .c { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.lead .contact { grid-column: 1 / -1; font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.lead select { width: auto; padding: 2px 6px; font-size: 12px; border-radius: 8px; }
.lead .notes { grid-column: 1 / -1; font-size: 13px; }
.lead .id { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.muted { color: var(--muted); }
.task { border-bottom: 1px solid var(--line); padding: 10px 0; display: flex; flex-direction: column; gap: 4px; }
.task .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.task .brief { font-size: 14px; overflow-wrap: anywhere; }
.task details { font-size: 13px; color: var(--muted); }
.task details div { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 4px; }
.pill.working { background: var(--accent-soft); color: var(--accent); }
.pill.done { background: var(--good-soft); color: var(--good); }
.pill.failed { background: var(--bad-soft); color: var(--bad); }

/* Phones and narrow windows: the sidebar slides in over the page. */
@media (max-width: 860px) {
  #menuBtn { display: grid; }
  header.top { padding: 6px 10px; padding-left: max(10px, env(safe-area-inset-left, 0px)); }
  .side {
    position: fixed; inset: 0 auto 0 0; z-index: 30; width: min(84vw, 300px); transform: translateX(-102%);
    transition: transform 0.22s ease; box-shadow: var(--shadow);
  }
  .app.drawer .side { transform: none; }
  .app.drawer .scrim { display: block; position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.32); }
  .col, .pane > .head, .log, .compose-wrap, .quick { padding-left: 14px; padding-right: 14px; }
  .msg.user { max-width: 88%; }
  .msg.manager { grid-template-columns: minmax(0, 1fr); }
  .msg.manager::before { display: none; }
  .msg.manager > * { grid-column: 1; }
  .empty h3 { font-size: 24px; }
  .suggest { grid-template-columns: minmax(0, 1fr); }
  .suggest button:nth-child(n+4) { display: none; }
  #pane-right > .scroll { padding-left: 14px; padding-right: 14px; }
}
@media (max-width: 860px) { .pane > .head h2 { display: none; } .pane > .head { justify-content: flex-end; padding-top: 0; } }
@media (min-width: 861px) { .app:not([data-view="chat"]) #viewTitle { visibility: hidden; } }
@media (max-width: 520px) {
  .compose-bar { flex-wrap: nowrap; gap: 4px; }
  .mode-switch button { padding: 4px 9px; }
  .pill-btn { padding: 4px 9px; }
  .refine-box .auto { padding: 0 2px; }
  header.top #checkBtn { display: none; }
}
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }
</style>

<div class="app" id="app" data-view="chat">

<script type="application/json" id="codebook">{"bash": "# Bash / shell\n## Rules\n- Start with `#!/usr/bin/env bash` and `set -euo pipefail`.\n- Quote every variable: `\"$var\"`, `\"$@\"`. Use `[[ ... ]]` for tests, `$(...)` not backticks.\n- Check commands exist: `command -v jq >/dev/null || { echo \"need jq\" >&2; exit 1; }`.\n## Template\n```bash\n#!/usr/bin/env bash\nset -euo pipefail\nusage() { echo \"usage: $0 -i INPUT [-o OUTPUT]\" >&2; exit 2; }\nin=\"\" out=\"out.txt\"\nwhile getopts \"i:o:h\" opt; do\n  case \"$opt\" in i) in=\"$OPTARG\";; o) out=\"$OPTARG\";; *) usage;; esac\ndone\n[[ -n \"$in\" && -f \"$in\" ]] || usage\ntmp=\"$(mktemp)\"; trap 'rm -f \"$tmp\"' EXIT\nwhile IFS= read -r line; do\n  [[ -z \"$line\" ]] && continue\n  printf '%s\\n' \"${line^^}\" >>\"$tmp\"\ndone \u003c\"$in\"\nmv \"$tmp\" \"$out\"\necho \"wrote $out\"\n```\nLoops: `for f in *.log; do ...; done`. Arithmetic: `$(( a + b ))`. Defaults: `${VAR:-default}`.\nJSON: `curl -fsS \"$url\" | jq -r '.items[].name'`. Cron: `crontab -e`, `*/15 * * * * /path/script.sh >>/var/log/x.log 2>&1`.\n## Pitfalls\n- Spaces around `=` break assignment (`a = 1` is wrong). `[ $x = y ]` breaks when x is empty: quote it.\n- Pipes hide failures without `pipefail`. `cd` can fail: `cd dir || exit 1`. Never `rm -rf \"$dir/\"` with an unchecked var.\n", "html-css": "# HTML and CSS\n## Rules\n- Start with `\u003c!doctype html>`, `\u003chtml lang=\"en\">`, `\u003cmeta charset=\"utf-8\">`, `\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">`.\n- Semantic tags: header, nav, main, section, article, footer, button (not clickable divs), label for every input.\n- Mobile-first CSS; use flexbox for rows, grid for 2D layouts. Relative units (rem, %, fr). Contrast at least 4.5:1.\n- CSS variables for colors on `:root`; dark mode with `@media (prefers-color-scheme: dark)`.\n## Template\n```html\n\u003c!doctype html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>App\u003c/title>\n\u003cstyle>\n  :root { --ink: #18212b; --bg: #f7f5f0; --accent: #d2551f; }\n  * { box-sizing: border-box; }\n  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: var(--ink); background: var(--bg); }\n  main { max-width: 720px; margin: 0 auto; padding: 16px; }\n  .row { display: flex; gap: 8px; flex-wrap: wrap; }\n  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }\n  button { font: inherit; padding: 10px 14px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; }\n  input { font: inherit; padding: 10px; border: 1px solid #ccc; border-radius: 8px; width: 100%; }\n\u003c/style>\u003c/head>\n\u003cbody>\u003cmain>\n  \u003ch1>Title\u003c/h1>\n  \u003cform id=\"form\" class=\"row\">\u003clabel for=\"q\">Search\u003c/label>\u003cinput id=\"q\" name=\"q\" required>\u003cbutton>Go\u003c/button>\u003c/form>\n  \u003cdiv id=\"out\" class=\"grid\">\u003c/div>\n\u003c/main>\u003cscript>/* JS here */\u003c/script>\u003c/body>\u003c/html>\n```\nCentering: `display:grid; place-items:center`. Sticky header: `position:sticky; top:0`. Truncate: `overflow:hidden; text-overflow:ellipsis; white-space:nowrap`.\n## Pitfalls\n- Missing viewport meta = tiny text on phones. Images need `alt` and `max-width:100%`.\n- `z-index` only works on positioned elements. Margins collapse vertically; use gap/padding.\n", "javascript": "# JavaScript (ES2020+, browser and Node)\n## Rules\n- `const` by default, `let` when reassigned, never `var`. `===` not `==`. Semicolons consistently.\n- camelCase variables/functions, PascalCase classes. Arrow functions for callbacks.\n- Always `await` promises inside `async` functions and wrap with try/catch. `fetch` does not throw on 404: check `res.ok`.\n- DOM: `textContent` for text (safe); `innerHTML` only with trusted strings (XSS risk).\n## Templates\n```js\nasync function getJson(url, opts = {}) {\n  const res = await fetch(url, { headers: { \"Content-Type\": \"application/json\" }, ...opts });\n  if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);\n  return res.json();\n}\n\nconst $ = (sel) => document.querySelector(sel);\nfunction el(tag, props = {}, ...kids) {\n  const n = Object.assign(document.createElement(tag), props);\n  n.append(...kids.filter((k) => k != null));\n  return n;\n}\n\ndocument.addEventListener(\"DOMContentLoaded\", () => {\n  $(\"#form\").addEventListener(\"submit\", async (e) => {\n    e.preventDefault();\n    const data = Object.fromEntries(new FormData(e.target));\n    try { const out = await getJson(\"/api/items\", { method: \"POST\", body: JSON.stringify(data) }); render(out); }\n    catch (err) { $(\"#msg\").textContent = err.message; }\n  });\n});\n```\nArrays: `map`, `filter`, `reduce`, `find`, `some`, `every`, `sort((a, b) => a - b)` (default sort is text!).\nObjects: spread `{...a, b: 1}`, `Object.entries(o)`, optional chaining `a?.b?.c`, nullish `x ?? def`.\nStorage: `localStorage.setItem(k, JSON.stringify(v))`; `JSON.parse(localStorage.getItem(k) || \"null\")` in try/catch.\nNode: `import fs from \"node:fs/promises\"; await fs.readFile(p, \"utf8\")`; Express `app.get(\"/\", (req, res) => res.json({}))`.\n## Pitfalls\n- `this` in callbacks: use arrow functions. Floating point: `0.1 + 0.2 !== 0.3`; money in integer cents.\n- `parseInt(x, 10)` always with radix; `Number(\"\")` is 0. Dates: months are 0-based in `new Date(y, m, d)`.\n- forEach ignores `await`; use `for (const x of arr) await f(x)` or `Promise.all(arr.map(f))`.\n", "method": "# Method: how to write code that works the first time\nUse this every time, whatever the language. Small models succeed by following steps, not by guessing.\n\n## Steps\n1. Restate the task in one line. List inputs, outputs and edge cases (empty, zero, huge, missing, wrong type).\n2. Pick the simplest approach that fully works. Prefer the standard library over new dependencies.\n3. Write the code in small functions (each does one thing, under ~30 lines). Name things for what they mean.\n4. Handle errors at the edges: validate input, check results of I/O and network calls, never swallow errors silently.\n5. Self-check before answering, line by line:\n   - Every variable is defined before use; every import is used and exists.\n   - Every opened thing is closed (files, connections); every promise is awaited.\n   - Brackets, quotes and indentation balance. No placeholder like TODO or \"...\" left in code.\n   - Off-by-one: loop bounds, slicing ends, 0- vs 1-based indexes.\n   - The code does exactly what was asked, nothing more.\n6. Give a tiny usage example or test that proves it works.\n\n## Output rules\n- Return complete, runnable code: every file in full, with its path. Never \"rest unchanged\".\n- One fenced code block per file, with the language tag. No prose inside code blocks.\n- If something is unknown (an API key, a URL, a schema), use a clearly named constant at the top and say so.\n- Never invent library functions. If unsure a function exists, use a simpler construct you are sure of.\n- Keep secrets out of code: read them from environment variables or config.\n\n## Debugging\nRead the error message fully. Find the exact line. Form one hypothesis, change one thing, re-run.\nCommon causes: wrong type (string vs number), undefined/None, wrong path, async not awaited, wrong indentation.\n\n## Security basics (all languages)\n- Never build SQL, shell commands or HTML by string concatenation with user input: use parameters/escaping.\n- Validate and limit all input (length, type, range). Use HTTPS. Hash passwords (bcrypt/argon2), never store plain.\n- Least privilege: request only the permissions and scopes the feature needs.\n", "python": "# Python (3.10+)\n## Rules\n- 4-space indent, snake_case for functions/variables, PascalCase for classes, UPPER_CASE constants.\n- Use f-strings, `pathlib.Path`, `with open(...)` (auto-close), type hints on functions.\n- Prefer list/dict comprehensions for simple transforms; plain loops when there is logic.\n- `if __name__ == \"__main__\":` guard for scripts. `None` checks with `is None`.\n- Mutable default args are a bug: `def f(x=None): x = x or []`.\n## Templates\n```python\nimport json, logging, sys\nfrom pathlib import Path\n\nlog = logging.getLogger(__name__)\n\ndef load_json(path: str | Path) -> dict:\n    try:\n        return json.loads(Path(path).read_text(encoding=\"utf-8\"))\n    except FileNotFoundError:\n        log.warning(\"missing %s\", path); return {}\n\ndef main(argv: list[str]) -> int:\n    if len(argv) \u003c 2:\n        print(\"usage: app.py FILE\", file=sys.stderr); return 2\n    data = load_json(argv[1])\n    print(len(data)); return 0\n\nif __name__ == \"__main__\":\n    raise SystemExit(main(sys.argv))\n```\nHTTP with httpx (or requests): `r = httpx.get(url, timeout=20); r.raise_for_status(); data = r.json()`.\nAsync: `async def f(): async with httpx.AsyncClient() as c: r = await c.get(url)`; run with `asyncio.run(f())`.\nDataclass: `@dataclass class User: name: str; age: int = 0`.\nCLI: `argparse.ArgumentParser(); p.add_argument(\"--n\", type=int, default=10)`.\nSQLite: `con = sqlite3.connect(\"db.sqlite\"); con.execute(\"SELECT * FROM t WHERE id = ?\", (id,))`.\nFastAPI: `app = FastAPI(); @app.get(\"/items/{id}\") async def get(id: int): return {\"id\": id}`.\nTests (pytest): `def test_add(): assert add(2, 3) == 5`; run `pytest -q`.\n## Pitfalls\n- `==` vs `is`; integer division `//`; `range(n)` stops at n-1; dict iteration order is insertion order.\n- Don't catch bare `except:`; catch specific exceptions. Don't modify a list while iterating it.\n- Timezones: use `datetime.now(timezone.utc)`. Floats for money are wrong: use `Decimal` or integer cents.\n", "sql": "# SQL (PostgreSQL, SQLite, MySQL)\n## Rules\n- Always parameterized queries (`?`, `$1`, `%s` depending on driver). Never concatenate user input.\n- Every table: primary key, `created_at` timestamp, NOT NULL where possible, foreign keys with ON DELETE rule.\n- Index columns used in WHERE/JOIN/ORDER BY. Use transactions for multi-step writes.\n## Templates\n```sql\nCREATE TABLE customers (\n  id BIGSERIAL PRIMARY KEY,               -- SQLite: INTEGER PRIMARY KEY AUTOINCREMENT\n  email TEXT NOT NULL UNIQUE,\n  name TEXT NOT NULL,\n  created_at TIMESTAMPTZ NOT NULL DEFAULT now()\n);\nCREATE TABLE orders (\n  id BIGSERIAL PRIMARY KEY,\n  customer_id BIGINT NOT NULL REFERENCES customers(id) ON DELETE CASCADE,\n  total_cents INTEGER NOT NULL CHECK (total_cents >= 0),\n  created_at TIMESTAMPTZ NOT NULL DEFAULT now()\n);\nCREATE INDEX orders_customer ON orders (customer_id, created_at DESC);\n\n-- top customers by spend in the last 30 days\nSELECT c.name, SUM(o.total_cents) / 100.0 AS spent\nFROM orders o JOIN customers c ON c.id = o.customer_id\nWHERE o.created_at >= now() - INTERVAL '30 days'\nGROUP BY c.id, c.name\nORDER BY spent DESC\nLIMIT 10;\n\n-- upsert\nINSERT INTO customers (email, name) VALUES ($1, $2)\nON CONFLICT (email) DO UPDATE SET name = EXCLUDED.name;\n```\nWindow functions: `ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY created_at DESC)`.\nSupabase/Postgres row-level security: `ALTER TABLE t ENABLE ROW LEVEL SECURITY; CREATE POLICY own ON t USING (auth.uid() = user_id);`\n## Pitfalls\n- `NULL = NULL` is not true: use `IS NULL`. `COUNT(col)` skips NULLs; `COUNT(*)` doesn't.\n- Every non-aggregated SELECT column must be in GROUP BY. `LIKE '%x%'` can't use a normal index.\n- Money as integer cents or NUMERIC, never FLOAT.\n", "typescript": "# TypeScript\n## Rules\n- `strict: true`. Type function parameters and return values; let locals be inferred.\n- `interface` for object shapes, `type` for unions. Avoid `any`; use `unknown` and narrow with checks.\n- Discriminated unions for states: `type S = { kind: \"ok\"; data: T } | { kind: \"err\"; error: string }`.\n## Templates\n```ts\ninterface User { id: number; name: string; email?: string }\n\nasync function fetchUser(id: number): Promise\u003cUser> {\n  const res = await fetch(`/api/users/${id}`);\n  if (!res.ok) throw new Error(`HTTP ${res.status}`);\n  return (await res.json()) as User;\n}\n\nfunction isUser(x: unknown): x is User {\n  return typeof x === \"object\" && x !== null && typeof (x as User).id === \"number\";\n}\n```\nGenerics: `function first\u003cT>(xs: T[]): T | undefined { return xs[0]; }`. Utility types: `Partial\u003cT>`, `Pick\u003cT,\"a\">`, `Record\u003cstring, T>`.\nReact (TSX): `function Card({ title }: { title: string }) { const [n, setN] = useState(0); return \u003cbutton onClick={() => setN(n + 1)}>{title} {n}\u003c/button>; }`\n## Pitfalls\n- `as` casts don't check anything at runtime; validate external data. Non-null `!` hides bugs.\n- Enums compile to objects; prefer string-literal unions. Keep `tsconfig` `moduleResolution` consistent with the bundler.\n"}</script>

// ---------- Storage: the artifact's database, or memory in a preview ----------
function memoryStore() {
  const cols = {}, subs = {};
  const emit = (c) => (subs[c] || []).forEach((fn) => fn(Object.entries(cols[c] || {}).map(([id, d]) => ({ id, ...d }))));
  return {
    persistent: false,
    sub(c, fn) { (subs[c] ||= []).push(fn); emit(c); return () => { subs[c] = subs[c].filter((f) => f !== fn); }; },
    async set(c, id, d) { (cols[c] ||= {})[id] = { ...d }; emit(c); },
    async update(c, id, d) { cols[c][id] = { ...cols[c][id], ...d }; emit(c); },
    async del(c, id) { delete (cols[c] || {})[id]; emit(c); },
    async clear(c) { cols[c] = {}; emit(c); },
  };
}
function dbStore(db) {
  return {
    persistent: true,
    sub(c, fn, onErr) {
      let q = db.collection(c);
      if (c === "chat" || c.endsWith("/chat")) q = q.orderBy("at", "desc").limit(200);
      return q.onSnapshot((snap) => fn(snap.docs.map((d) => ({ id: d.id, ...d.data() }))), onErr);
    },
    set: (c, id, d) => db.collection(c).doc(id).set(d),
    update: (c, id, d) => db.collection(c).doc(id).update(d),
    del: (c, id) => db.collection(c).doc(id).delete(),
    async clear(c) {
      for (;;) {
        const snap = await db.collection(c).limit(500).get();
        if (!snap.docs.length) return;
        for (const d of snap.docs) await db.collection(c).doc(d.id).delete();
      }
    },
  };
}
const short = (v, n = 200) => String(v ?? "").replace(/\s+/g, " ").trim().slice(0, n);
const shortId = (prefix, taken) => {
  for (;;) {
    const id = prefix + Math.random().toString(36).slice(2, 6);
    if (!taken.has(id)) return id;
  }
};

// chat and Airtable table. The first profile ("main") keeps the page's original top-level

// under spaces/<id>/. The list of profiles is the "spaces" collection.
const MAIN = "main";
const spacePath = (id, c) => (id === MAIN ? c : `spaces/${id}/${c}`);
function scoped(base, id) {
  const p = (c) => spacePath(id, c);
  return {
    persistent: base.persistent,
    sub: (c, fn, onErr) => base.sub(p(c), fn, onErr),
    set: (c, i, d) => base.set(p(c), i, d),
    update: (c, i, d) => base.update(p(c), i, d),
    del: (c, i) => base.del(p(c), i),
    clear: (c) => base.clear(p(c)),
  };
}
const spaceName = (id) => S.spaces.find((x) => x.id === id)?.name || (id === S.space && S.profile?.company) || (id === MAIN ? "My first profile" : "New profile");

function openSpace(id) {
  S.unsubs.forEach((u) => { try { u?.(); } catch { /* already closed */ } });
  S.unsubs = [];
  S.space = id;
  try { localStorage.setItem("myops.space", id); } catch { /* per-viewer convenience only */ }
  Object.assign(S, { bots: [], tasks: [], leads: [], outbox: [], chat: [], reports: [], notes: [], videos: [], apps: [], aichat: [], screen: null, profile: null, memory: null, at: null, atNote: "", loaded: false, editingProfile: false });
  S.store = scoped(S.root, id);
  const onErr = (e) => { if (e?.code !== "unavailable") setStatus("Live updates stopped. Reload the page.", true); };
  const sub = (c, fn) => S.unsubs.push(S.store.sub(c, fn, onErr));
  sub("bots", (rows) => { S.bots = rows; renderTeam(); });
  sub("tasks", (rows) => { S.tasks = rows; renderTasks(); });
  sub("reports", (rows) => { S.reports = rows; renderReports(); });
  sub("notes", (rows) => { S.notes = rows; renderNotes(); });
  sub("aichat", (rows) => { S.aichat = rows; if (S.chatMode === "ai") renderChat(); });
  sub("videos", (rows) => { S.videos = rows; renderVideos(); });
  sub("apps", (rows) => { S.apps = rows; renderApps(); });
  sub("leads", (rows) => { S.leads = rows; renderLeads(); });
  sub("config", (rows) => {
    const cfg = rows.find((r) => r.id === "airtable");
    S.at = cfg && cfg.baseId && cfg.tableId && cfg.fields?.sid ? cfg : null;
    S.memory = rows.find((r) => r.id === "memory") || null;
    S.screen = rows.find((r) => r.id === "screen") || null;
    const prof = rows.find((r) => r.id === "profile");
    S.profile = prof && prof.company ? prof : null;
    S.loaded = true;
    // Profiles saved before the switcher existed get their name in the list here.
    if (S.profile && !S.readOnly && S.root.persistent && S.spaces.find((x) => x.id === id)?.name !== S.profile.company)
      S.root.set("spaces", id, { name: S.profile.company, createdAt: S.spaces.find((x) => x.id === id)?.createdAt || S.profile.createdAt || Date.now() }).catch(() => {});
    $("tagline").textContent = S.profile
      ? `MyOps for ${S.profile.company}: your personal AI team. Tell the Manager what you need; it hires bots through the Recruiter and HR, delegates the work, and queues every message for your sign-off.`
      : "Your personal AI team. Tell the Manager what you need; it hires bots through the Recruiter and HR, delegates the work, and queues every message for your sign-off.";
    renderAirtableButtons(); renderConnections(); renderOperation(); renderChat(); renderSpaces(); renderScreener();
  });
  sub("outbox", (rows) => { S.outbox = rows; renderOutbox(); });
  sub("chat", (rows) => {
    const pending = S.chat.filter((m) => String(m.id).startsWith("pending-") && !rows.some((r) => r.at === m.at && r.role === m.role));
    S.chat = [...rows, ...pending]; renderChat();
  });
  renderAll();
}

function message(role, text, steps, live, refined) {
  const who = role === "user" ? "You" : role === "ai" ? "AI" : "Manager";
  const stepList = (steps || []).length ? el("ul", { className: "steps" },
    steps.map((s) => el("li", { className: s.state || "done", textContent: s.text }))) : null;
  const wrapSteps = stepList && !live
    ? el("details", { className: "steps-wrap" }, el("summary", { textContent: `${steps.length} step${steps.length === 1 ? "" : "s"} by the team` }), stepList)
    : stepList;
  const node = el("div", { className: `msg ${role === "user" ? "user" : "manager"}${live ? " working" : ""}` },
    el("div", { className: "who", textContent: who }),
    wrapSteps && role !== "user" ? wrapSteps : null,
    el("div", { className: "text", textContent: text }),
    refined && refined !== text ? el("div", { className: "refined", textContent: `Understood as: ${refined}` }) : null,
  );
  node.dataset.mark = role === "ai" ? "AI" : "M";
  return node;
}

const SAMPLE_ERRORS = {
  not_granted: "Claude access was declined for this page, so the team can't work. Reload the page to be asked again.",
  sampling_disabled: "Claude isn't available on this account.",
  rate_limited: "You've hit a usage limit. Wait a bit, then send again.",
  session_expired: "Your session expired. Sign in to claude.ai again.",
  refused: "Claude declined that request. Rephrase it and try again.",
  invalid_json: "A bot replied in an unexpected format. Send the request again.",
  prompt_too_large: "There's too much to read at once. Clear some contacts or start a shorter request.",
  cancelled: "Stopped.",
};
const errText = (e) => SAMPLE_ERRORS[e?.code] || `Claude didn't answer (${e?.code || "error"}). Try again in a moment.`;
const errDetail = (e) => [e?.code, e?.message].filter(Boolean).join(": ").slice(0, 400);
const parseJson = (text) => {
  const t = String(text || "").trim();
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  const body = fence ? fence[1] : t.slice(Math.min(...["{", "["].map((c) => t.indexOf(c)).filter((i) => i >= 0)), Math.max(t.lastIndexOf("}"), t.lastIndexOf("]")) + 1);
  return JSON.parse(body);
};

// One structured call, with recovery so one odd reply doesn't stop the whole team:
// - a reply with prose around the JSON is parsed from its text;
// - "invalid_json" (the model answered in plain text) is retried as a plain call asking for JSON only,
//   first on the same model tier, then on the fast one;
// - "upstream_error" on the standard model is retried once on the fast model.
// Calls that use tools (Clay, Airtable) are not re-run, so no credits are spent twice.
async function askJson(prompt, signal, tools) {
  const plain = async (tier) => {
    const { text } = await S.sample(prompt + "\n\nReply with ONLY the JSON object described above: no prose, no markdown fences.",
      { signal, cache: false, modelTier: tier });
    try { return parseJson(text); } catch { throw { code: "invalid_json", message: `the ${tier} model's reply was not JSON`, text }; }
  };
  try {
    return await S.sample.json(prompt, tools ? { signal, cache: false, modelTier: S.tier, tools } : { signal, cache: false, modelTier: S.tier });
  } catch (e) {
    if (e?.code === "cancelled" || e?.code === "not_granted" || e?.code === "rate_limited" || e?.code === "session_expired") throw e;
    if (e?.text) { try { return parseJson(e.text); } catch { /* fall through to a retry */ } }
    S.lastError = errDetail(e);
    if (tools) throw e;
    if (e?.code === "invalid_json") {
      try { return await plain(S.tier); } catch (e2) { if (e2?.code === "cancelled" || S.tier === "quick") throw e2; }
      return plain("quick");
    }
    if (e?.code === "upstream_error" && S.tier !== "quick") return plain("quick");
    throw e;
  }
}

function step(text) {
  const s = { text, state: "live" };
  S.live.steps.forEach((x) => { if (x.state === "live") x.state = "done"; });
  S.live.steps.push(s); renderChat();
  return { done(t) { s.state = "done"; if (t) s.text = t; renderChat(); }, fail(t) { s.state = "fail"; if (t) s.text = t; renderChat(); } };
}

async function runManager(message, signal) {
  const history = [...S.chat].sort((a, b) => (a.at || 0) - (b.at || 0)).slice(-12).map((m) => ({ role: m.role, text: m.text.slice(0, 1500) }));
  const results = [];
  for (let round = 1; round <= MAX_ROUNDS; round++) {
    const st = step(round === 1 ? "Manager is planning…" : "Manager is reviewing the results…");
    let plan;
    try { plan = await askJson(managerPrompt(history, message, results, round), signal); }
    catch (e) { st.fail(`${round === 1 ? "Manager couldn't start" : "Manager couldn't finish"} (${errDetail(e) || "no details"})`); throw e; }
    const actions = Array.isArray(plan?.actions) ? plan.actions.slice(0, 6) : [];
    st.done(round === 1 ? "Manager made a plan" : "Manager reviewed the results");
    if (!actions.length || round === MAX_ROUNDS) return String(plan?.reply || "Done.");
    if (plan.reply) S.live.text = String(plan.reply);
    for (const a of actions) {
      if (signal.aborted) throw { code: "cancelled" };
      results.push(await runAction(a, signal));
    }
  }
  return "Done.";
}

async function runAction(a, signal) {
  const type = String(a?.type || "");
  if (type === "hire") return hire(String(a.job || ""), String(a.name || ""), signal);
  if (type === "delegate") return delegate(String(a.bot || ""), String(a.task || ""), signal);
  if (type === "ask_cto") return askCto(String(a.question || ""), signal);
  if (type === "scribe") return scribeWrite(String(a.request || ""), signal);
  if (type === "make_video") return produceVideo(String(a.request || ""), signal);
  if (type === "screen") return screenStocks(String(a.request || ""), signal);
  if (type === "hunt_repos") return huntRepos(String(a.request || ""), signal);
  if (type === "browse") return browseWeb(String(a.task || ""), signal);
  if (type === "build_app") return buildApp(String(a.request || ""), String(a.app_id || ""), signal);
  if (type === "maintenance") return runMaintenance(a.mode === "fix" ? "fix" : "check", signal);
  if (type === "fire") {
    const bot = S.bots.find((b) => b.name === a.bot);
    if (!bot) return `fire ${a.bot}: no such bot.`;
    const st = step(`Retiring ${bot.name}…`);
    await S.store.del("bots", bot.id);
    st.done(`${bot.name} retired`);
    return `fire ${bot.name}: retired.`;
  }
  return `Unknown action ${JSON.stringify(a).slice(0, 120)}: skipped.`;
}

// ---------- Git Hunter: open-source repos that fit the owner's work ----------
async function githubSearch(q, signal) {
  const res = await fetch(`https://api.github.com/search/repositories?q=${encodeURIComponent(q)}&per_page=10`,
    { headers: { accept: "application/vnd.github+json" }, signal });
  if (res.status === 403 || res.status === 429) throw Object.assign(new Error("GitHub's search limit is used up for now; try again in a minute."), { code: "rate_limited" });
  if (!res.ok) throw new Error(`GitHub search error ${res.status}`);
  return ((await res.json()).items || []).map((r) => ({
    repo: r.full_name, url: r.html_url, about: String(r.description || "").slice(0, 300), stars: r.stargazers_count, forks: r.forks_count,
    language: r.language || "", license: r.license?.spdx_id || "none", pushed: String(r.pushed_at || "").slice(0, 10), archived: !!r.archived, topics: (r.topics || []).slice(0, 6),
  }));
}
async function huntRepos(request, signal) {
  if (!request) return "hunt_repos: no request given.";
  const st = step("Git Hunter is working out what to search…");

      `Pick the best 3 to 8 for the need and rank them. Judge fit first, then activity (last push; before ${yearAgo} is stale; archived is out), adoption (stars, forks), license (MIT/Apache/BSD easy; GPL/AGPL bind products that ship or host it; none = no permission to reuse) and risk (unofficial scrapers that break, abandoned). Use only facts given above; never invent repos, numbers or features.`,
      'Reply with ONLY a JSON object: {"title": "short title", "summary": "two sentences: what you searched and the top pick", "picks": [{"repo": "owner/name", "url": "https://github.com/owner/name", "why": "what it does for the owner and why it fits", "license": "", "stars": 0, "last_push": "", "caution": ""}]}',

  }), "", `_${how}_`].join("\n");

const ASPECTS = { "16:9": [1280, 720], "9:16": [720, 1280], "1:1": [1080, 1080] };
const HEX = /^#[0-9a-fA-F]{6}$/;
function validateVideo(v) {

    headline: String(x?.headline || "").slice(0, 90), sub: String(x?.sub || "").slice(0, 160),

    scenes, narration: String(v?.narration || "").slice(0, 6000), caption: String(v?.caption || "").slice(0, 2200),
  };
}
async function produceVideo(request, signal) {
  if (!request) return "make_video: no brief given.";

  try {

      `Who the team works for:\n${profileBrief()}`,
      `Brief: ${request}`,
      "Plan 3 to 10 scenes. Each scene: a punchy headline (at most 8 words) and an optional sub line (at most 20 words), shown for 2 to 8 seconds. Open with a hook, end with a clear call to action. Pick the aspect: 16:9 for websites and YouTube, 9:16 for Reels, Shorts and TikTok, 1:1 for feeds. Pick a readable palette (hex colors: bg, fg with strong contrast, accent). Write a voice-over script matching the scenes, and a post caption with hashtags if it is for social media.",
      "Only state facts about the business that appear above or in the brief; never invent prices, results, awards or testimonials.",
      'Reply with ONLY a JSON object: {"title": "", "aspect": "16:9", "palette": {"bg": "#18212b", "fg": "#ffffff", "accent": "#d2551f"}, "scenes": [{"headline": "", "sub": "", "seconds": 4}], "narration": "", "caption": ""}',
    ].join("\n\n"), signal));
  } catch (e) { st.fail("Video Producer couldn't finish"); if (e?.code === "cancelled") throw e; return `make_video failed (${errText(e)}).`; }
  if (!v.scenes.length) { st.fail("The storyboard had no scenes"); return "make_video: the storyboard came back without scenes."; }
  const id = shortId("v", new Set(S.videos.map((x) => x.id)));
  const doc = { ...v, request: request.slice(0, 500), createdAt: Date.now() };
  await S.store.set("videos", id, doc);
  if (!S.videos.some((x) => x.id === id)) S.videos.push({ id, ...doc });
  const secs = v.scenes.reduce((a, x) => a + x.seconds, 0);
  st.done(`Video Producer made "${v.title}" (${v.scenes.length} scenes, ${secs}s, ${v.aspect})`);
  return `make_video: "${v.title}" is ready in the Videos tab: ${v.scenes.length} scenes, ${secs} seconds, ${v.aspect}. The owner can play it and download it as a video file; narration and caption are included.`;

function wrapLines(ctx, text, maxW) {
  const words = String(text).split(/\s+/), lines = [];
  let line = "";
  for (const w of words) { const t = line ? line + " " + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line);
  return lines;
}
const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
// Draws the video at time t (seconds): gradient background with drifting accent shapes,
// headline and sub line easing in and out per scene, a progress bar and the business name.
function drawVideoFrame(ctx, v, t) {
  const [W, H] = ASPECTS[v.aspect], { bg, fg, accent } = v.palette;
  const total = v.scenes.reduce((a, x) => a + x.seconds, 0);
  let acc = 0, idx = 0;
  while (idx < v.scenes.length - 1 && t >= acc + v.scenes[idx].seconds) { acc += v.scenes[idx].seconds; idx++; }
  const sc = v.scenes[idx], lt = t - acc, p = lt / sc.seconds;
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, bg); g.addColorStop(1, accent + "55");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let k = 0; k < 3; k++) {
    const r = Math.min(W, H) * (0.18 + k * 0.08);
    ctx.beginPath();
    ctx.arc(W * (0.15 + 0.35 * k) + Math.sin(t * 0.4 + k) * W * 0.05, H * (0.8 - 0.3 * k) + Math.cos(t * 0.3 + k) * H * 0.04, r, 0, Math.PI * 2);
    ctx.fillStyle = accent + "22"; ctx.fill();
  }
  const fadeIn = ease(lt / 0.5), fadeOut = 1 - ease((lt - (sc.seconds - 0.4)) / 0.4);
  const alpha = Math.max(0, Math.min(fadeIn, fadeOut));
  const pad = W * 0.08, maxW = W - pad * 2, big = Math.round(Math.min(W, H) * 0.085);
  ctx.globalAlpha = alpha; ctx.fillStyle = fg; ctx.textBaseline = "top";
  ctx.font = `700 ${big}px Inter, "Segoe UI", system-ui, sans-serif`;
  const head = wrapLines(ctx, sc.headline, maxW);
  ctx.font = `400 ${Math.round(big * 0.45)}px Inter, "Segoe UI", system-ui, sans-serif`;
  const sub = sc.sub ? wrapLines(ctx, sc.sub, maxW) : [];
  const blockH = head.length * big * 1.15 + (sub.length ? big * 0.5 + sub.length * big * 0.6 : 0);
  let y = (H - blockH) / 2 + (1 - fadeIn) * big * 0.6;
  ctx.fillStyle = accent; ctx.fillRect(pad, y - big * 0.45, big * 1.2, Math.max(4, big * 0.08));
  ctx.fillStyle = fg; ctx.font = `700 ${big}px Inter, "Segoe UI", system-ui, sans-serif`;
  for (const l of head) { ctx.fillText(l, pad, y); y += big * 1.15; }
  if (sub.length) {
    y += big * 0.5; ctx.globalAlpha = alpha * 0.85; ctx.font = `400 ${Math.round(big * 0.45)}px Inter, "Segoe UI", system-ui, sans-serif`;
    for (const l of sub) { ctx.fillText(l, pad, y); y += big * 0.6; }
  }
  ctx.globalAlpha = 0.7; ctx.fillStyle = fg; ctx.font = `600 ${Math.round(big * 0.3)}px Inter, "Segoe UI", system-ui, sans-serif`;
  ctx.fillText(S.profile?.company || "MyOps", pad, H - pad * 0.9);
  ctx.globalAlpha = 1; ctx.fillStyle = fg + "33"; ctx.fillRect(0, H - 6, W, 6);
  ctx.fillStyle = accent; ctx.fillRect(0, H - 6, W * Math.min(1, t / total), 6);
  return { total, p };
}
function videoPlayer(v) {
  const [W, H] = ASPECTS[v.aspect];
  const canvas = el("canvas", { width: W, height: H, style: `width:100%;max-width:${v.aspect === "9:16" ? 220 : 420}px;border-radius:10px;display:block;background:${v.palette.bg}` });
  const ctx = canvas.getContext("2d");
  const total = v.scenes.reduce((a, x) => a + x.seconds, 0);
  drawVideoFrame(ctx, v, 0.6);
  let raf = 0;
  const play = el("button", { className: "btn ghost small", type: "button", textContent: "▶ Play" });
  const stop = () => { cancelAnimationFrame(raf); raf = 0; play.textContent = "▶ Play"; };
  play.onclick = () => {
    if (raf) return stop();
    const t0 = performance.now(); play.textContent = "■ Stop";
    const tick = () => { const t = (performance.now() - t0) / 1000; drawVideoFrame(ctx, v, Math.min(t, total)); if (t < total) raf = requestAnimationFrame(tick); else stop(); };
    raf = requestAnimationFrame(tick);
  };
  const dl = el("button", { className: "btn ghost small", type: "button", textContent: "Render & download video", hidden: !S.downloads || typeof MediaRecorder === "undefined" });
  dl.onclick = () => recordVideo(v, dl);
  return { canvas, play, dl };
}
// Real-time recording of the canvas with MediaRecorder; the file is offered through the downloads capability.
async function recordVideo(v, btn) {
  const [W, H] = ASPECTS[v.aspect];
  const total = v.scenes.reduce((a, x) => a + x.seconds, 0);
  const canvas = el("canvas", { width: W, height: H });
  const ctx = canvas.getContext("2d");
  const type = ["video/mp4;codecs=avc1", "video/webm;codecs=vp9", "video/webm"].find((m) => MediaRecorder.isTypeSupported?.(m));
  if (!type) { btn.textContent = "Video recording isn't supported in this browser"; return; }
  const ext = type.startsWith("video/mp4") ? "mp4" : "webm";
  btn.disabled = true;
  const rec = new MediaRecorder(canvas.captureStream(30), { mimeType: type, videoBitsPerSecond: 4_000_000 });
  const chunks = [];
  rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  const done = new Promise((res) => (rec.onstop = res));
  drawVideoFrame(ctx, v, 0);
  rec.start(250);
  const t0 = performance.now();
  await new Promise((res) => {
    const tick = () => {
      const t = (performance.now() - t0) / 1000;
      drawVideoFrame(ctx, v, Math.min(t, total));
      btn.textContent = `Rendering… ${Math.min(100, Math.round((t / total) * 100))}%`;
      if (t < total + 0.2) setTimeout(tick, 1000 / 30); else res();
    };
    tick();
  });
  rec.stop(); await done;
  await saveFile(`${slugText(v.title)}.${ext}`, new Blob(chunks, { type }), btn, "Render & download video");
}
async function saveFile(filename, data, btn, label) {
  const restore = label || btn.textContent;
  if (!S.downloads) { btn.textContent = "Downloads aren't available here"; return; }
  btn.disabled = true;
  try { await S.downloads.save({ filename, data }); btn.textContent = "Saved"; }
  catch (e) { btn.textContent = e?.code === "declined" ? "Not saved" : `Couldn't save (${e?.code || "error"})`; }
  setTimeout(() => { btn.textContent = restore; btn.disabled = false; }, 2500);
}
const slugText = (t) => String(t || "file").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "file";

      el("div", { style: "margin:8px 0" }, canvas),

}

const STUCK_MS = 30 * 60 * 1000, STALE_MS = 30 * 24 * 3600 * 1000;

function contactKey(l) {

async function runMaintenance(mode, signal) {
  const now = Date.now();
  const sys = step("Systems Maintainer is checking the team…");
  const tech = techStatus();
  const stuck = S.tasks.filter((t) => t.status === "working" && now - (t.createdAt || 0) > STUCK_MS);
  const failed = S.tasks.filter((t) => t.status === "failed" && now - (t.createdAt || 0) < 7 * 24 * 3600 * 1000);
  const blocked = S.bots.map((b) => ({ bot: b.name, tools: (b.tools || []).filter((t) => tech.tools_that_cannot_work_now.includes(t)) })).filter((x) => x.tools.length);
  sys.done(`Systems Maintainer: ${stuck.length} stuck task(s), ${failed.length} failed this week, ${blocked.length} bot(s) with tools that can't work`);
  const data = step("Data Keeper is checking the records…");
  const groups = {};
  for (const l of S.leads) { const k = contactKey(l); if (k) (groups[k] ||= []).push(l); }
  const dupes = Object.values(groups).filter((g) => g.length > 1);
  const stale = S.outbox.filter((d) => d.status === "pending" && now - (d.createdAt || 0) > STALE_MS);
  const nameless = S.leads.filter((l) => !String(l.name || "").trim());
  data.done(`Data Keeper: ${dupes.reduce((a, g) => a + g.length - 1, 0)} duplicate contact(s), ${stale.length} draft(s) waiting over 30 days, ${nameless.length} contact(s) without a name`);
  if (signal?.aborted) throw { code: "cancelled" };

  const fixed = [];
  if (mode === "fix") {
    const fx = step("Maintenance team is fixing what it safely can…");
    try {
      for (const t of stuck) await S.store.update("tasks", t.id, { status: "failed", report: (t.report ? t.report + "\n\n" : "") + "Marked failed by Maintenance: no result after 30 minutes.", finishedAt: now });
      if (stuck.length) fixed.push(`marked ${stuck.length} stuck task(s) failed`);
      let merged = 0;
      for (const g of dupes) {
        const [keep, ...rest] = [...g].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
        const patch = {};
        for (const f of ["name", "company", "title", "email", "phone", "linkedin"]) if (!keep[f]) { const v = rest.find((x) => x[f])?.[f]; if (v) patch[f] = v; }
        const best = [keep, ...rest].reduce((a, x) => ((RANK[x.status] ?? 0) > (RANK[a] ?? 0) ? x.status : a), keep.status || "new");
        if (best !== keep.status) patch.status = best;
        const notes = [...new Set([keep, ...rest].map((x) => String(x.notes || "").trim()).filter(Boolean))].join("\n").slice(0, 2000);
        if (notes !== String(keep.notes || "").trim()) patch.notes = notes;
        if (Object.keys(patch).length) await S.store.update("leads", keep.id, { ...patch, updatedAt: now });
        for (const x of rest) {
          for (const d of S.outbox.filter((d) => d.lead === x.id)) await S.store.update("outbox", d.id, { lead: keep.id });
          await S.store.del("leads", x.id); merged++;
        }
      }
      if (merged) fixed.push(`merged ${merged} duplicate contact(s) into their oldest record`);
      for (const d of stale) await S.store.update("outbox", d.id, { status: "expired", decidedAt: now });
      if (stale.length) fixed.push(`expired ${stale.length} draft(s) waiting over 30 days`);
      fx.done(fixed.length ? `Fixed: ${fixed.join("; ")}` : "Nothing needed fixing");
    } catch (e) { fx.fail("A fix failed part-way"); return `maintenance fix failed part-way (${errText(e)}); done so far: ${fixed.join("; ") || "nothing"}.`; }
  }

  const lines = [
    `Connections: Clay ${tech.connections.clay}; Airtable ${tech.connections.airtable}; Claude tier ${S.tier}${S.lastError ? `; last AI error: ${S.lastError}` : ""}.`,
    `Tasks: ${S.tasks.length} total, ${stuck.length} stuck (working over 30 minutes), ${failed.length} failed in the last 7 days.`,
    ...failed.slice(0, 5).map((t) => `- Failed #${t.n} (${t.bot}): ${short(t.report, 160)}`),
    blocked.length ? `Bots with tools that can't work now: ${blocked.map((x) => `${x.bot} (${x.tools.join(", ")})`).join("; ")}.` : "Every bot's tools can work with what is connected.",
    `Contacts: ${S.leads.length}, ${dupes.reduce((a, g) => a + g.length - 1, 0)} duplicates in ${dupes.length} group(s)${dupes.length ? ": " + dupes.slice(0, 5).map((g) => g[0].name || g[0].email).join(", ") : ""}; ${nameless.length} without a name.`,
    `Out-tray: ${S.outbox.filter((d) => d.status === "pending").length} drafts pending, ${stale.length} waiting over 30 days.`,
    `Records: ${S.notes.length} notes, ${S.videos.length} videos, ${S.apps.length} apps, ${S.reports.length} research reports.`,
    mode === "fix" ? `Fixed: ${fixed.join("; ") || "nothing needed fixing"}.` : (stuck.length || dupes.length || stale.length ? "Ask for a clean-up to fix the stuck tasks, duplicates and stale drafts." : "Nothing needs cleaning up."),
    S.at && mode === "fix" && dupes.length ? "Merged contacts were removed here only; remove them from the Airtable table too if you sync it." : "",
  ].filter(Boolean);
  const title = `Health check ${new Date(now).toLocaleDateString()}${mode === "fix" ? " (clean-up)" : ""}`;
  const id = shortId("n", new Set(S.notes.map((n) => n.id)));
  const doc = { title, body: lines.join("\n"), by: "maintenance", request: `maintenance ${mode}`, createdAt: now, updatedAt: now };
  await S.store.set("notes", id, doc).catch(() => {});
  if (!S.notes.some((n) => n.id === id)) S.notes.push({ id, ...doc });
  return `maintenance ${mode} (report saved in Notes as "${title}"):\n${lines.join("\n")}`;
}

      `Markets with data: ${have.map((mk) => `${mk} = ${MARKETS[mk]} (${screenerFor(mk).rows.length} stocks, data as of ${screenerFor(mk).meta.generated_at}, prices in ${screenerFor(mk).meta.currency}, index ${screenerFor(mk).meta.benchmark})`).join("; ")}. Pick the market from the request: Indian, NSE, Nifty, rupee or Indian company names mean "in"; US, American, dollar or penny stocks mean "us_penny". If the request names no market, use "${currentMarket()}" (the one open in the Screener tab).`,
      screenerFor("in")?.meta.sectors?.length ? `Sectors (India, Nifty 500 stocks only; put words to match in "sectors"): ${screenerFor("in").meta.sectors.join(", ")}. Other Indian stocks and US penny stocks have no sector, so a sector filter limits results to Nifty 500 stocks.` : "",
      "Work out what the owner means, not just the words: \"about to break out\" is near_breakout; \"cheap\" or \"beaten down\" usually means oversold (low RSI) or far below the 52-week high; \"strong\" or \"leaders\" means strong 6-month returns vs SPY near highs; \"liquid\" means dollar volume. Combine conditions when the request implies several. Keep the screen loose enough to return results (start from the closest preset and add only what the request asks for).",
      `Fields (key: label, kind, unit): ${Object.entries(SCREEN_FIELDS).map(([k, [l, kd, u]]) => `${k}: ${l}, ${kd}${u ? ", " + u : ""}`).join("; ")}.`,
      `Presets (JSON): ${JSON.stringify(SCREEN_PRESETS)}`,
      "The data is technical only (prices and volume): there is no market cap, valuation or fundamentals. If the request needs those, screen what you can and say what is missing in the explanation.",
      'Reply with ONLY a JSON object: {"market": "in", "criteria": {"min": {}, "max": {}, "is": {}, "tickers": [], "sectors": [], "sort": "score", "desc": true, "limit": 25}, "explanation": "one or two sentences: how you read the request and what the screen does"}',
    ].filter(Boolean).join("\n\n"), signal);

// CTO: the live technical picture, technical questions, and a tools check on every hire.
function techStatus() {
  const latest = reportsByDate()[0];
  const usable = {
    find_leads: S.clay === "available", web_research: S.clay === "available",
    airtable: S.atState === "available" && !!S.at, research_read: !!latest,
    crm_read: true, crm_write: true, draft_email: true, draft_sms: true,
  };
  return {
    claude: { model_tier: S.tier, last_error: S.lastError || null },
    connections: { clay: S.clay, airtable: S.at ? `${S.atState} (${S.at.baseName || "table set up"})` : `${S.atState}, no table set up` },
    research_reports: latest ? { count: S.reports.length, latest: latest.generated_at, stocks: (latest.items || []).length } : "none",
    tools_that_work_now: Object.entries(usable).filter(([, ok]) => ok).map(([t]) => t),
    tools_that_cannot_work_now: Object.entries(usable).filter(([, ok]) => !ok).map(([t]) => t),
    bots: S.bots.map((b) => ({ name: b.name, tools: b.tools })),

const CTO_INTRO = "You are the CTO of MyOps, the owner's personal team of AI bot employees. You own the technology: the Claude models the team runs on, the connections (Clay for company/contact data and web research, Airtable for the contact table), the research data (reports from the MyOps research engine) and which bot tools can work right now.";
async function askCto(question, signal) {
  if (!question) return "ask_cto: no question given.";
  const st = step("CTO is looking into it…");
  try {
    const out = await askJson([
      CTO_INTRO,
      `Live technical status (JSON): ${JSON.stringify(techStatus())}`,
      `Question from the Manager: ${question}`,
      "Answer from the status only; never invent status. If something must be set up, say exactly what the owner should do (for example: connect Clay in claude.ai Settings > Connectors, or open Contacts and create the Airtable table).",
      'Reply with ONLY a JSON object: {"answer": "short, concrete answer"}',
    ].join("\n"), signal);
    st.done("CTO answered");
    return `CTO: ${String(out?.answer || "no answer").slice(0, 1500)}`;
  } catch (e) { st.fail("CTO couldn't answer"); if (e?.code === "cancelled") throw e; return `ask_cto failed (${errText(e)}).`; }
}
async function ctoReview(job, spec, signal) {
  const status = techStatus();
  const out = await askJson([
    CTO_INTRO,
    "Review this candidate bot's technical setup before HR sees it.",
    `Job description: ${job}`,
    `Candidate: ${JSON.stringify(spec)}`,
    `Live technical status (JSON): ${JSON.stringify(status)}`,
    "Approve if the job can be done with tools that work now. Drop tools the job does not need or that cannot work now (the bot would only fail with them), and reject if the job is impossible until something is set up, saying what.",
    'Reply with ONLY a JSON object: {"approved": true or false, "drop_tools": ["tool", ...], "reason": "one or two sentences"}',
  ].join("\n"), signal);
  const drop = Array.isArray(out?.drop_tools) ? out.drop_tools.map(String) : [];
  return { approved: out?.approved === true, drop, reason: String(out?.reason || "") };
}

// Recruiter + HR
function validateSpec(spec) {
  const problems = [];
  const name = String(spec?.name || "").trim().toLowerCase();
  if (!NAME_RE.test(name)) problems.push("name must be 2-32 characters: lowercase letters, digits or _, starting with a letter");
  if (STAFF.some((p) => p.name === name) || S.bots.some((b) => b.name === name)) problems.push(`the name ${name} is taken`);
  if (!String(spec?.role || "").trim()) problems.push("role is empty");
  if (String(spec?.instructions || "").trim().length < 60) problems.push("instructions are too short");
  const tools = Array.isArray(spec?.tools) ? spec.tools.map(String) : [];
  const unknown = tools.filter((t) => !(t in TOOLS));
  if (unknown.length) problems.push(`unknown tools: ${unknown.join(", ")}`);
  return { problems, spec: { name, role: String(spec?.role || "").trim(), instructions: String(spec?.instructions || "").trim(), tools: [...new Set(tools)].filter((t) => t in TOOLS) } };
}

async function hire(job, wanted, signal) {
  if (!job) return "hire: no job description given.";
  let st = step(`Recruiter is designing ${wanted || "a new bot"}…`);
  const recruiterPrompt = (feedback) => [
    `You are the Recruiter on ${orgName()}'s MyOps team of AI bot employees. Design one new bot for this job.`,
    `Who the team works for:\n${profileBrief()}`,
    `Job description from the Manager: ${job}`,
    wanted ? `The Manager would like it named: ${wanted}` : "",
    `Names already taken: ${[...STAFF.map((p) => p.name), ...S.bots.map((b) => b.name)].join(", ")}`,
    `Tools you can grant (grant only what the job needs): ${Object.entries(TOOLS).map(([k, v]) => `${k}: ${v}`).join("; ")}.`,
    "A bot that analyses stocks, markets or other research data needs research_read (it reads the real numbers in the latest research report; it cannot fetch prices itself). A bot whose job is finding leads needs find_leads together with crm_write so it can save what it finds. A bot that researches companies, news or market signals needs web_research (plus crm_write if it should record what it learns on leads). Only find_leads gives a bot access to real company and contact data (through Clay); without it bots cannot browse the web. No bot can send messages; drafted emails and texts wait for the owner's approval.",
    "Write the instructions in the second person: responsibilities, how to work, quality bar, tone for any messages, and limits (never invent contact details, respect consent and anti-spam rules, say what is missing instead of guessing).",
    feedback ? `Your previous design was rejected by validation: ${feedback}. Fix it.` : "",
    'Reply with ONLY a JSON object: {"name": "snake_case", "role": "one line", "instructions": "full instructions", "tools": ["crm_read", ...]}',
  ].filter(Boolean).join("\n");
  let checked;
  try {
    checked = validateSpec(await askJson(recruiterPrompt(""), signal));
    if (checked.problems.length) {
      st.fail(`Recruiter's design needed fixes: ${checked.problems.join("; ")}`);
      st = step("Recruiter is revising the design…");
      checked = validateSpec(await askJson(recruiterPrompt(checked.problems.join("; ")), signal));
    }
  } catch (e) { st.fail("Recruiter couldn't finish"); if (e?.code === "cancelled") throw e; return `hire: the Recruiter failed (${errText(e)}).`; }
  if (checked.problems.length) { st.fail("Recruiter's design was invalid"); return `hire: rejected by validation (${checked.problems.join("; ")}).`; }
  const spec = checked.spec;
  st.done(`Recruiter designed ${spec.name} (${spec.tools.join(", ") || "no tools"})`);

  st = step(`CTO is checking ${spec.name}'s tools…`);
  try {
    const tech = await ctoReview(job, spec, signal);
    if (!tech.approved) { st.fail(`CTO rejected ${spec.name}: ${tech.reason || "no reason given"}`); return `hire ${spec.name}: the CTO rejected it. Reason: ${tech.reason || "none given"}.`; }
    const dropped = spec.tools.filter((t) => tech.drop.includes(t));
    spec.tools = spec.tools.filter((t) => !tech.drop.includes(t));
    st.done(`CTO approved ${spec.name}${dropped.length ? ` (removed ${dropped.join(", ")})` : ""}: ${tech.reason}`.trim());
  } catch (e) { st.fail("CTO couldn't finish the review"); if (e?.code === "cancelled") throw e; return `hire ${spec.name}: CTO review failed (${errText(e)}).`; }

  st = step(`HR is reviewing ${spec.name}…`);
  let verdict;
  try {
    verdict = await askJson([
      `You are HR on ${orgName()}'s MyOps team of AI bot employees. Review this candidate bot before it joins the team.`,
      `Job description: ${job}`,
      `Candidate: ${JSON.stringify(spec)}`,
      "Approve only if: the role matches the job; the instructions are clear, honest and safe (no deception, no spam, respects consent and anti-spam law); and the tools are the minimum the job needs (drafting emails or texts must be justified by the job).",
      'Reply with ONLY a JSON object: {"approved": true or false, "reason": "one or two sentences"}',
    ].join("\n"), signal);
  } catch (e) { st.fail("HR couldn't finish the review"); if (e?.code === "cancelled") throw e; return `hire ${spec.name}: HR review failed (${errText(e)}).`; }
  if (verdict?.approved !== true) {
    st.fail(`HR rejected ${spec.name}: ${verdict?.reason || "no reason given"}`);
    return `hire ${spec.name}: HR rejected it. Reason: ${verdict?.reason || "none given"}.`;
  }
  await S.store.set("bots", spec.name, { ...spec, hiredAt: Date.now(), job });
  S.bots = [...S.bots.filter((b) => b.name !== spec.name), { id: spec.name, ...spec, hiredAt: Date.now() }];
  st.done(`HR approved ${spec.name}: ${verdict.reason || ""}`.trim());
  return `hire ${spec.name}: hired as "${spec.role}" with tools ${spec.tools.join(", ") || "none"}. HR: ${verdict.reason || ""}`;
}

// Clay through the owner's claude.ai connector. Returns sample() tools, or null when Clay can't be used.
// Clay's raw results are large (full descriptions, every office address), so each result is cut
// down to what a bot needs before it is handed back.
function slimClay(r) {
  const out = { taskId: r?.taskId, hasMore: !!r?.hasMore };
  const companies = Object.values(r?.companies || {});
  if (companies.length) out.companies = companies.map((c) => ({
    entityId: c.entityId, name: c.name, domain: c.domain, website: c.website, industry: c.industry,
    size: c.size, location: c.locality, revenue: c.annual_revenue, about: short(c.description, 220),
    ...((c.enrichments || []).length ? { research: c.enrichments.map((e) => ({
      name: e.name, state: e.state, value: e.state === "completed" ? short(researchValue(e.value), 2500) || "(nothing found)" : undefined })) } : {}),
  }));
  const contacts = r?.contacts || [];
  if (contacts.length) out.contacts = contacts.map((p) => {
    const email = (p.enrichments || []).find((e) => /email/i.test(String(e.name || "")));
    return {
      entityId: p.entityId, name: p.name, title: p.latest_experience_title, company: p.latest_experience_company,
      domain: p.domain, linkedin: p.url, location: p.location_name,
      email: email ? (emailValue(email.value) || `(${email.state === "completed" ? "not found" : email.state})`) : undefined,
    };
  });
  return out;
}
// Research answers arrive as text or as JSON (sometimes JSON-encoded); flatten to readable text.
function researchValue(v) {
  if (v == null) return "";
  let x = v;
  if (typeof x === "string" && /^[\[{]/.test(x.trim())) { try { x = JSON.parse(x); } catch { /* keep the string */ } }
  if (typeof x === "object") {
    const vals = Object.values(x);
    x = vals.length === 1 && typeof vals[0] === "string" ? vals[0] : JSON.stringify(x);
  }
  return String(x);
}
// A finished lookup arrives as {"Work Email": "a@b.com"} (sometimes JSON-encoded) or a plain address.
function emailValue(v) {
  if (v == null || v === "") return "";
  let x = v;
  if (typeof x === "string" && x.trim().startsWith("{")) { try { x = JSON.parse(x); } catch { /* keep the string */ } }
  if (typeof x === "object") x = Object.values(x).find((y) => typeof y === "string" && y.includes("@")) || "";
  x = String(x).trim();
  return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x) ? x : "";
}
async function callClay(tool, input, signal) {
  const r = await S.mcp.callTool(CLAY, tool, input, signal ? { signal } : undefined);
  return slimClay(r.payload);
}

function clayError(e) {
