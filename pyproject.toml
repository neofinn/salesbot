[project]
name = "salesbot"
version = "0.1.0"
description = "A team of AI bot employees (manager, HR, recruiter, workers) you run from Telegram."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.15",
    "openai>=1.50",
    "google-genai>=1.0",
    "python-telegram-bot>=21.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
salesbot = "salesbot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["salesbot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
